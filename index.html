<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Packing Chop</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{
    --navy:#1B3A63;
    --blue-accent:#2E6FB5;
    --bg:#D5D8DC;
    --card:#ffffff;
    --text:#1F2937;
    --muted:#6B7280;
    --border:#E2E5E9;
    --good:#1E8E5A;
    --warn:#C0392B;
    --amber:#B7791F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  header{
    background:var(--navy);
    color:#fff;
    border-radius:10px;
    padding:20px 26px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
  }
  header h1{margin:0;font-size:19px;letter-spacing:.3px;}
  header .sub{font-size:12px;color:#B9C7D9;margin-top:4px;}
  header .actions{display:flex;gap:10px;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:7px;
    padding:10px 16px;
    font-size:13px;
    font-weight:600;
    transition:.15s;
  }
  .btn-primary{background:var(--blue-accent);color:#fff;}
  .btn-primary:hover{background:#255a94;}
  .btn-export{background:#1E8E5A;color:#fff;}
  .btn-export:hover{background:#166b44;}
  .btn-export:disabled{background:#9BB;opacity:.6;cursor:default;}
  .btn-del{background:#F5E4E2;color:var(--warn);padding:5px 9px;font-size:12px;font-weight:600;}
  .btn-del:hover{background:#eecdc9;}

  .tab-bar{
    display:flex;align-items:center;gap:8px;margin-bottom:16px;
  }
  .tab-single{
    padding:9px 20px;background:var(--navy);color:#fff;border-radius:8px;
    font-size:13px;font-weight:700;letter-spacing:.2px;
  }
  .tab-single .count{
    display:inline-block;margin-left:8px;font-size:10.5px;
    background:rgba(255,255,255,.22);border-radius:10px;padding:1px 7px;
  }
  .tab-btn{
    padding:9px 20px;background:#EEF1F4;color:var(--navy);border-radius:8px;
    font-size:13px;font-weight:700;letter-spacing:.2px;cursor:pointer;transition:.15s;
  }
  .tab-btn:hover{background:#E2E7EC;}
  .tab-btn.active{background:var(--navy);color:#fff;}
  .tab-btn .count{
    display:inline-block;margin-left:8px;font-size:10.5px;
    background:rgba(0,0,0,.08);border-radius:10px;padding:1px 7px;
  }
  .tab-btn.active .count{background:rgba(255,255,255,.22);}

  .grid{display:grid;grid-template-columns:340px 1fr;gap:18px;}
  @media(max-width:860px){.grid{grid-template-columns:1fr;}}

  .card{
    background:var(--card);
    border-radius:10px;
    padding:20px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .card h2{margin:0 0 14px;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;}

  .dropzone{
    border:2px dashed #A9BBD1;
    border-radius:8px;
    padding:22px 14px;
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    cursor:pointer;
    transition:.15s;
    background:#F7F9FB;
  }
  .dropzone.drag{border-color:var(--blue-accent);background:#EAF2FA;}
  .dropzone.locked{cursor:default;}
  .dropzone img{max-width:100%;max-height:120px;border-radius:6px;margin-bottom:8px;}
  .dropzone .hint{font-size:11px;color:#94A3B8;margin-top:4px;}

  .dz-actions{display:flex;gap:8px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap;}
  .dz-btn{
    background:#fff;color:var(--blue-accent);border:1px solid var(--blue-accent);
    padding:7px 12px;border-radius:6px;font-size:12px;font-weight:600;
  }
  .dz-btn:hover{background:#EAF2FA;}
  .dz-btn:disabled{opacity:.5;cursor:default;background:#F2F4F6;color:var(--muted);border-color:var(--border);}

  .ocr-status{
    margin-top:10px;font-size:12px;padding:8px 10px;border-radius:6px;display:none;
  }
  .ocr-status.show{display:block;}
  .ocr-status.loading{background:#EEF3FA;color:var(--blue-accent);}
  .ocr-status.ok{background:#E7F5EC;color:var(--good);}
  .ocr-status.err{background:#FBEAEA;color:var(--warn);}

  label{display:block;font-size:11.5px;color:var(--muted);margin:12px 0 5px;font-weight:600;}
  input[type=text],input[type=number],select{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;
    font-size:13px;font-family:inherit;color:var(--text);background:#fff;
  }
  input:focus,select:focus{outline:2px solid #BBD3EC;border-color:var(--blue-accent);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{
    background:var(--navy);color:#fff;text-align:left;padding:9px 10px;
    font-size:11px;text-transform:uppercase;letter-spacing:.3px;
  }
  td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#F7F9FB;}
  .empty-row td{text-align:center;color:var(--muted);padding:30px;font-style:italic;}

  .stamp-cell{display:flex;align-items:center;gap:8px;}
  .stamp-thumb{
    width:44px;height:44px;object-fit:cover;border-radius:6px;
    border:1px solid var(--border);background:#F7F9FB;flex-shrink:0;
  }
  .stamp-thumb-empty{
    width:44px;height:44px;border-radius:6px;border:1px dashed var(--border);
    background:#F7F9FB;flex-shrink:0;
  }
  .stamp-name-text{font-weight:600;}

  .factory-chip{
    display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700;
    background:#EAF2FA;color:var(--blue-accent);
  }
  .status-pill{
    display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;
  }
  .pill-ok{background:#E7F5EC;color:var(--good);}
  .pill-bad{background:#FBEAEA;color:var(--warn);}
  .pill-default{background:#EEF1F4;color:var(--muted);}
  .pill-info{background:#EAF2FA;color:var(--blue-accent);}

  .summary-section{display:none;}
  .summary-card{
    background:var(--card);
    border-radius:10px;
    padding:20px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    margin-bottom:18px;
  }
  .summary-card h2{margin:0 0 4px;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;}
  .summary-card .summary-sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;}
  .summary-chart-wrap{position:relative;height:261px;}

  .summary-pair{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px;}
  .summary-chart-card{flex:1 1 320px;min-width:280px;margin-bottom:0;}
  .summary-chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .summary-chart-head h2{margin-bottom:0;}
  .summary-year-compare{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
  .summary-year-compare select{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;background:#fff;color:var(--navy);}

  .top-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;}
  .top-row .field{flex:1;min-width:140px;}
  .top-row label{margin-top:0;}

  #signBox{border:1px solid var(--border);border-radius:7px;padding:8px;background:#F7F9FB;}
  .sig-preview{display:flex;align-items:center;gap:8px;}
  .sig-preview img{height:34px;background:#fff;border:1px solid var(--border);border-radius:4px;padding:2px 6px;}
  .sig-signed-label{font-size:11px;color:var(--good);font-weight:700;}
  .btn-reset-sign{background:transparent;color:var(--muted);text-decoration:underline;padding:2px 0;font-size:10.5px;font-weight:400;}
  .lock-hint{font-size:10.5px;color:var(--warn);margin-top:6px;font-weight:600;}

  .sign-choice-row{display:flex;gap:6px;}
  .btn-sign-done{background:var(--good);color:#fff;padding:7px 10px;border-radius:6px;font-size:11.5px;font-weight:700;flex:1;}
  .btn-sign-done:hover{background:#166b44;}
  .btn-sign-comment{background:var(--amber);color:#fff;padding:7px 10px;border-radius:6px;font-size:11.5px;font-weight:700;flex:1;}
  .btn-sign-comment:hover{background:#93610f;}
  .btn-cancel-choice{background:transparent;color:var(--muted);text-decoration:underline;padding:4px 0;font-size:10.5px;font-weight:400;width:100%;text-align:center;margin-top:4px;}
  #commentInput{width:100%;font-family:inherit;font-size:12px;padding:7px 8px;border:1px solid var(--border);border-radius:6px;resize:vertical;}
  .comment-box{background:#FFF6E9;border:1px solid #F0D9B5;border-radius:6px;padding:8px;}
  .comment-label{font-size:11px;font-weight:700;color:var(--amber);}
  .comment-text{font-size:12px;color:var(--text);margin-top:4px;white-space:pre-wrap;word-break:break-word;}
  .btn-unlock{
    display:block;width:100%;margin-top:8px;background:#EAF2FA;color:var(--blue-accent);
    border:1px solid #BBD3EC;padding:7px 10px;border-radius:6px;font-size:11.5px;font-weight:700;
  }
  .btn-unlock:hover{background:#DCE9F7;}

  /* Receiver/ID search-select */
  .receiver-wrap{position:relative;}
  .receiver-dropdown{
    position:absolute;left:0;right:0;top:calc(100% + 2px);
    background:#fff;border:1px solid var(--border);border-radius:7px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:230px;overflow-y:auto;
    z-index:50;display:none;
  }
  .receiver-dropdown.show{display:block;}
  .receiver-option{
    padding:8px 10px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--border);
  }
  .receiver-option:last-child{border-bottom:none;}
  .receiver-option:hover,.receiver-option.active{background:#EAF2FA;}
  .receiver-option .rname{font-weight:600;color:var(--text);}
  .receiver-option .rmeta{font-size:11px;color:var(--muted);margin-top:2px;}
  .receiver-empty{padding:10px;text-align:center;font-size:12px;color:var(--muted);font-style:italic;}

  .table-wrap{overflow-x:auto;}
  footer{margin-top:16px;text-align:center;font-size:11px;color:#8592A3;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>PACKING CHOP UPDATE</h1>
    </div>
    <div class="actions">
      <button class="btn-export" id="btnExport">⭳ Export Excel</button>
    </div>
  </header>

  <div class="tab-bar">
    <div class="tab-btn active" id="tabWorker" data-section="WORKER">Worker Packing Chop<span class="count" id="totalCountWorker">0</span></div>
    <div class="tab-btn" id="tabQC" data-section="QC">QC Packing Chop<span class="count" id="totalCountQC">0</span></div>
    <div class="tab-btn" id="tabSummary" data-section="SUMMARY">Summary</div>
    <button class="btn-export" id="btnRefreshSummary" style="margin-left:auto;">⟳ Refresh</button>
  </div>

  <div class="grid" id="sectionGrid">
    <!-- LEFT: input card -->
    <div class="card">
      <h2>Add new stamp</h2>

      <div class="dropzone" id="dropzone">
        <div id="dzContent">
          <div id="dzHintText"></div>
          <div id="dzPreview"></div>
          <div class="dz-actions">
            <button type="button" class="dz-btn" id="btnTakePhoto">📷 Take Photo</button>
            <button type="button" class="dz-btn" id="btnUploadFile">🖼 Upload from Device</button>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
        <input type="file" id="fileInputCamera" accept="image/*" capture="environment" style="display:none;">
      </div>
      <div class="ocr-status" id="ocrStatus"></div>

      <label>Year</label>
      <select id="fYear"></select>

      <label>Factory</label>
      <select id="fFactory">
        <option value="F1">F1</option>
        <option value="F2">F2</option>
        <option value="F3">F3</option>
        <option value="F4">F4</option>
        <option value="F6">F6</option>
        <option value="F7">F7</option>
      </select>

      <label>Stamp name</label>
      <input type="text" id="fStampName" placeholder="e.g. PA - 1">

      <label>Receiver / ID</label>
      <div class="receiver-wrap">
        <input type="text" id="fReceiver" placeholder="Type name or ID to search..." autocomplete="off">
        <div class="receiver-dropdown" id="receiverDropdown"></div>
      </div>

      <label>Quantity</label>
      <input type="number" id="fQty" min="0" value="1">

      <label>Status</label>
      <select id="fStatus">
        <option value="Using">Using</option>
        <option value="Broken">Broken</option>
        <option value="Lost">Lost</option>
        <option value="Usable/Not Use">Usable/Not Use</option>
      </select>

      <button class="btn-primary" id="btnAdd" style="width:100%;margin-top:16px;">+ Add to list</button>
    </div>

    <!-- RIGHT: master table across all factories -->
    <div class="card">
      <div class="top-row">
        <div class="field" style="max-width:110px;min-width:90px;">
          <label>Year</label>
          <select id="fFilterYear">
            <option value="ALL">All</option>
          </select>
        </div>
        <div class="field" style="max-width:160px;">
          <label>Factory</label>
          <select id="fFilter">
            <option value="ALL">All</option>
          </select>
        </div>
        <div class="field" style="max-width:220px;">
          <label>Report by</label>
          <input type="text" id="fReportBy" placeholder="Reporter name">
        </div>
        <div class="field" style="max-width:210px;">
          <label>Approved by</label>
          <div id="signBox">
            <button id="btnSign" class="btn-primary" style="width:100%;padding:8px 10px;font-size:12px;">🔒 Sign as Kim Joo Shik</button>
            <div id="signStatus" style="font-size:11px;color:var(--muted);margin-top:6px;"></div>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:50px;">Factory</th>
              <th style="width:38px;">No.</th>
              <th>Stamp name</th>
              <th>Receiver/ID</th>
              <th>Dept.</th>
              <th style="width:60px;">Qty</th>
              <th>Status</th>
              <th style="width:44px;"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="summary-section" id="sectionSummary">
    <div class="summary-pair">
      <div class="summary-card summary-chart-card">
        <h2 id="workerCurrentYearTitle">Worker Packing Chop Summary</h2>
        <div class="summary-chart-wrap"><canvas id="workerCurrentYearChart"></canvas></div>
      </div>
      <div class="summary-card summary-chart-card">
        <div class="summary-chart-head">
          <h2>Worker Packing Chop Comparison</h2>
          <div class="summary-year-compare">
            <select id="workerCompareYearA"></select>
            <span>vs</span>
            <select id="workerCompareYearB"></select>
          </div>
        </div>
        <div class="summary-chart-wrap"><canvas id="workerCompareChart"></canvas></div>
      </div>
    </div>
    <div class="summary-pair">
      <div class="summary-card summary-chart-card">
        <h2 id="qcCurrentYearTitle">QC Packing Chop Summary</h2>
        <div class="summary-chart-wrap"><canvas id="qcCurrentYearChart"></canvas></div>
      </div>
      <div class="summary-card summary-chart-card">
        <div class="summary-chart-head">
          <h2>QC Packing Chop Comparison</h2>
          <div class="summary-year-compare">
            <select id="qcCompareYearA"></select>
            <span>vs</span>
            <select id="qcCompareYearB"></select>
          </div>
        </div>
        <div class="summary-chart-wrap"><canvas id="qcCompareChart"></canvas></div>
      </div>
    </div>
  </div>

</div>

const FORM_CODE_LINES = ["Ma so: USV/QA/R041", "Ngay ban hanh: 01/03/18", "Lan ban hanh: 01"];

const FACTORY_LIST = ["F1","F2","F3","F4","F6","F7"];
const DEPT_FIXED = "Packing";
const APPROVER_NAME = "Kim Joo Shik";

// Employee directory (Factory / ID / Full Name) — used to power the
// Receiver/ID search-select in the "Add new stamp" form.
// URL Web App Apps Script trả danh sách receiver (xem ReceiverAPI.gs)
const RECEIVER_API_URL = 'https://script.google.com/macros/s/AKfycbznWnp6qP5Pz6FQHId6sAnLuHbq4BA5bP5zBY2N4vg74KfwlU2ud2zaGjb1tlChfc1e/exec';

let EMPLOYEES = []; // được nạp động qua loadReceivers() khi trang khởi động

async function loadReceivers(){
  try{
    const res = await fetch(`${RECEIVER_API_URL}?action=getReceivers`);
    EMPLOYEES = await res.json();
  }catch(e){
    console.error('Không tải được danh sách receiver:', e);
    EMPLOYEES = [];
  }
}

// "Factory 1" -> "F1" (matches the Factory select's option values)
function factoryLabelToCode(label){
  const m = String(label || '').match(/(\d+)/);
  return m ? ('F' + m[1]) : '';
}

let state = {
  entries: [],          // {id,factory,no,stamp_name,receiver,dept,qty,status,year,imageDataUrl,imgW,imgH,section}
  reportBy: "",
  filter: "ALL",
  yearFilter: "ALL",
  signed: false,
  signatureDataUrl: null,
  comment: null,         // set when "Not Sign w/Comment" is used instead of signing
  activeSection: "WORKER" // "WORKER" or "QC" — which tab is currently shown
};

// Year options for the "Add new stamp" form and the Year filter: 2025 through the current year.
function yearOptionsList(){
  const nowY = new Date().getFullYear();
  const years = [];
  for(let y=2025; y<=nowY; y++){ years.push(y); }
  if(years.length===0) years.push(nowY);
  return years.sort((a,b)=>b-a);
}
function populateYearSelect(){
  const sel = document.getElementById('fYear');
  sel.innerHTML = yearOptionsList().map(y=>`<option value="${y}">${y}</option>`).join('');
  sel.value = String(new Date().getFullYear());
}

function entrySection(e){ return e.section || 'WORKER'; } // old saved entries default to Worker tab
function currentSectionEntries(){ return state.entries.filter(e=>entrySection(e)===state.activeSection); }
// Rows for the active section after applying the on-screen Factory + Year filters.
function visibleSectionRows(){
  return currentSectionEntries().filter(e=>
    (state.filter === 'ALL' || e.factory === state.filter) &&
    (state.yearFilter === 'ALL' || String(e.year) === String(state.yearFilter))
  );
}
let pendingImage = null; // {dataUrl, w, h} captured from the last uploaded image, attached to the next added entry

function todayISO(){ return new Date().toISOString().slice(0,10); }

async function loadState(){
  try{
    const r = await window.storage.get('stamp_app_state_v4');
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      state.entries = parsed.entries || [];
      state.reportBy = parsed.reportBy || "";
      state.signed = parsed.signed || false;
      state.signatureDataUrl = parsed.signatureDataUrl || null;
      state.comment = parsed.comment || null;
    }
  }catch(e){ /* no data yet */ }
  document.getElementById('fReportBy').value = state.reportBy;
  populateYearSelect();
  renderSignBox();
  render();
}
async function saveState(){
  try{
    await window.storage.set('stamp_app_state_v4', JSON.stringify({
      entries: state.entries, reportBy: state.reportBy,
      signed: state.signed, signatureDataUrl: state.signatureDataUrl,
      comment: state.comment
    }));
  }catch(e){ console.error('save failed', e); }
}

function factoriesInUse(){
  const set = new Set(FACTORY_LIST);
  currentSectionEntries().forEach(e=>set.add(e.factory));
  return Array.from(set).sort();
}

function yearsInUse(){
  const set = new Set(yearOptionsList());
  currentSectionEntries().forEach(e=>{ if(e.year) set.add(Number(e.year)); });
  return Array.from(set).sort((a,b)=>b-a);
}

function renderFilterOptions(){
  const sel = document.getElementById('fFilter');
  const current = state.filter;
  sel.innerHTML = '<option value="ALL">All</option>';
  factoriesInUse().forEach(f=>{
    const o = document.createElement('option');
    o.value = f; o.textContent = f;
    sel.appendChild(o);
  });
  sel.value = current;

  const ySel = document.getElementById('fFilterYear');
  const yCurrent = state.yearFilter;
  ySel.innerHTML = '<option value="ALL">All</option>';
  yearsInUse().forEach(y=>{
    const o = document.createElement('option');
    o.value = y; o.textContent = y;
    ySel.appendChild(o);
  });
  ySel.value = yCurrent;
}

function statusPillClass(s){
  if(/lost/i.test(s)) return 'pill-bad';
  if(/broken/i.test(s)) return 'pill-default';
  if(/usable/i.test(s)) return 'pill-info';
  return 'pill-ok';
}

// Fixed status keys tracked in the Summary charts, plus their chart colors.
const STAMP_STATUSES = ['Using','Broken','Lost','Usable/Not Use'];
const STATUS_COLORS = {
  'Using':'#1E8E5A',
  'Broken':'#B7791F',
  'Lost':'#C0392B',
  'Usable/Not Use':'#2E6FB5'
};

function renderTable(){
  document.getElementById('totalCountWorker').textContent = state.entries.filter(e=>entrySection(e)==='WORKER').length;
  document.getElementById('totalCountQC').textContent = state.entries.filter(e=>entrySection(e)==='QC').length;

  const rows = visibleSectionRows();

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  if(rows.length===0){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="8">No data yet. Upload a stamp label image to get started.</td></tr>`;
    return;
  }
  rows.forEach((r)=>{
    const tr = document.createElement('tr');
    const thumb = r.imageDataUrl
      ? `<img class="stamp-thumb" src="${r.imageDataUrl}" alt="stamp">`
      : `<div class="stamp-thumb-empty"></div>`;
    tr.innerHTML = `
      <td><span class="factory-chip">${escapeHtml(r.factory)}</span></td>
      <td>${r.no}</td>
      <td><div class="stamp-cell">${thumb}<span class="stamp-name-text">${escapeHtml(r.stamp_name)}</span></div></td>
      <td>${escapeHtml(r.receiver)}</td>
      <td>${escapeHtml(r.dept)}</td>
      <td>${r.qty}</td>
      <td><span class="status-pill ${statusPillClass(r.status)}">${escapeHtml(r.status)}</span></td>
      <td><button class="btn-del" data-id="${r.id}">✕</button></td>
    `;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('.btn-del').forEach(btn=>{
    btn.onclick = ()=>{
      showConfirmModal('Are you sure to delete?', ()=>{
        const removed = state.entries.find(e=>e.id === btn.dataset.id);
        state.entries = state.entries.filter(e=>e.id !== btn.dataset.id);
        if(removed) renumber(removed.factory, entrySection(removed));
        saveState(); render();
      });
    };
  });
}

// Simple Yes/No confirmation modal (used for delete actions)
function showConfirmModal(message, onYes){
  const existing = document.getElementById('confirmModalOverlay');
  if(existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'confirmModalOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:9999;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:10px;padding:22px 24px;max-width:320px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.2);">
      <div style="font-size:14px;color:#1F2937;margin-bottom:18px;">${escapeHtml(message)}</div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button id="confirmNoBtn" style="background:#EEF1F4;color:#374151;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;border:none;cursor:pointer;">No</button>
        <button id="confirmYesBtn" style="background:#C0392B;color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;border:none;cursor:pointer;">Yes</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = ()=> overlay.remove();
  document.getElementById('confirmNoBtn').onclick = close;
  document.getElementById('confirmYesBtn').onclick = ()=>{ close(); onYes(); };
  overlay.addEventListener('click', e=>{ if(e.target === overlay) close(); });
}

function renumber(factory, section){
  let n=1;
  state.entries.forEach(e=>{ if(e.factory===factory && entrySection(e)===section){ e.no = n++; } });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"\']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  renderFilterOptions();
  renderTable();
  applyLockState();
  toggleSummarySection();
}

// ---- Summary tab: toggle visibility + build the combo (stacked bar + total line) charts ----
let summaryCharts = {};

if(typeof Chart !== 'undefined' && typeof ChartDataLabels !== 'undefined'){
  Chart.register(ChartDataLabels);
}

// Chart.js v4 doesn't support dashed grid lines out of the box (only the axis border can be
// dashed), so this small plugin manually draws a dashed vertical line at each factory boundary.
const dashedFactoryGridPlugin = {
  id: 'dashedFactoryGrid',
  beforeDraw(chart, args, opts){
    if(!opts || !opts.enabled) return;
    const { ctx, chartArea, scales } = chart;
    const xScale = scales.x;
    if(!xScale || !xScale.ticks || xScale.ticks.length < 2) return;
    const pixels = xScale.ticks.map((t,i)=> xScale.getPixelForTick(i));
    const step = pixels[1] - pixels[0];
    const half = step / 2;
    const boundaries = pixels.map(p=> p - half);
    boundaries.push(pixels[pixels.length - 1] + half);
    ctx.save();
    ctx.strokeStyle = opts.color || '#C7CCD3';
    ctx.lineWidth = opts.lineWidth || 1;
    ctx.setLineDash(opts.dash || [4,4]);
    boundaries.forEach(x=>{
      ctx.beginPath();
      ctx.moveTo(x, chartArea.top);
      ctx.lineTo(x, chartArea.bottom);
      ctx.stroke();
    });
    ctx.restore();
  }
};
if(typeof Chart !== 'undefined'){ Chart.register(dashedFactoryGridPlugin); }

// Shared data-label rule for the Summary charts: hide the label entirely when the value is 0/empty.
function hasNonZeroValue(ctx){
  const v = ctx.dataset.data[ctx.dataIndex];
  return v !== 0 && v !== null && v !== undefined;
}
const BAR_DATALABELS = { display: hasNonZeroValue, anchor: 'end', align: 'top', offset: 2, color: '#3A4552', font: { size: 9, weight: '600' } };
const LINE_DATALABELS = (color)=> ({
  display: hasNonZeroValue, anchor: 'end', align: 'top', offset: 4, color, font: { size: 9.5, weight: '700' },
  backgroundColor: 'rgba(255,255,255,.85)', borderRadius: 3, padding: { top: 1, bottom: 1, left: 3, right: 3 }
});

function toggleSummarySection(){
  const isSummary = state.activeSection === 'SUMMARY';
  document.getElementById('sectionGrid').style.display = isSummary ? 'none' : '';
  document.getElementById('sectionSummary').style.display = isSummary ? 'block' : 'none';
  if(isSummary){
    // wait one frame so the now-visible canvas has a real width before Chart.js measures it
    requestAnimationFrame(renderSummaryCharts);
  }
}

// Default year pair used to seed the compare dropdowns: current calendar year vs. the one right before it.
function summaryYearPair(){
  const curYear = new Date().getFullYear();
  return { prevYear: curYear - 1, curYear };
}

// Years to offer in a section's compare dropdowns: the standard 2025..current range, plus any
// year that actually has data for that section (in case of older/odd records).
function yearsInUseForSection(section){
  const set = new Set(yearOptionsList());
  state.entries.filter(e=>entrySection(e)===section).forEach(e=>{ if(e.year) set.add(Number(e.year)); });
  return Array.from(set).sort((a,b)=>b-a);
}

// ---- Left chart: current-year breakdown per factory (4 grouped bars + total line) ----
function currentYearData(section){
  const { curYear } = summaryYearPair();
  const byFactory = FACTORY_LIST.map(f=>{
    const rec = { Using:0, Broken:0, Lost:0, 'Usable/Not Use':0 };
    state.entries
      .filter(e=> entrySection(e)===section && e.factory===f && Number(e.year)===curYear)
      .forEach(e=>{
        const qty = Number(e.qty) || 0;
        if(rec[e.status] !== undefined){ rec[e.status] += qty; }
      });
    return rec;
  });
  const totals = byFactory.map(rec=> STAMP_STATUSES.reduce((sum,k)=> sum + rec[k], 0));
  return { labels: FACTORY_LIST, byFactory, totals, curYear };
}

// Rounds an axis max up to a clean step so ticks land on tidy numbers instead of odd fractions.
function niceAxisMax(rawMax){
  if(rawMax <= 0) return 1;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawMax)));
  const step = magnitude / 2 || 1;
  return Math.ceil(rawMax / step) * step;
}

function buildCurrentYearChart(canvasId, section){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const { labels, byFactory, totals, curYear } = currentYearData(section);

  // No 'stack' set => the 4 status datasets render as 4 adjacent grouped bars per factory.
  const datasets = STAMP_STATUSES.map(status=>({
    type: 'bar',
    label: status,
    data: byFactory.map(rec=> rec[status]),
    backgroundColor: STATUS_COLORS[status],
    borderRadius: 3,
    maxBarThickness: 20,
    yAxisID: 'y',
    order: 2, // drawn first, so it sits underneath the line
    datalabels: BAR_DATALABELS
  }));
  datasets.push({
    type: 'line',
    label: 'Total ' + curYear,
    data: totals,
    borderColor: '#1B3A63',
    backgroundColor: '#1B3A63',
    borderWidth: 2.5,
    pointRadius: 4,
    pointHoverRadius: 5,
    pointBackgroundColor: '#1B3A63',
    tension: 0.25,
    yAxisID: 'y1',
    order: 1, // drawn last, always renders on top of the bars
    datalabels: LINE_DATALABELS('#1B3A63')
  });

  // Scale each axis off its own data range, giving the bar axis extra headroom so bars stay
  // in the lower part of the chart and the total line always reads above them.
  const maxBarVal = Math.max(1, ...byFactory.flatMap(rec=> STAMP_STATUSES.map(s=> rec[s])));
  const maxLineVal = Math.max(1, ...totals);
  const barAxisMax = niceAxisMax(maxBarVal * 2.2);
  const lineAxisMax = niceAxisMax(maxLineVal * 1.15);

  if(summaryCharts[canvasId]){ summaryCharts[canvasId].destroy(); }
  summaryCharts[canvasId] = new Chart(canvas.getContext('2d'), {
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 10.5 }, boxWidth: 11, padding: 10 } },
        tooltip: { mode: 'index', intersect: false },
        dashedFactoryGrid: { enabled: true, color: '#C7CCD3', dash: [4,4] }
      },
      scales: {
        x: { grid: { display: false, drawTicks: false }, ticks: { font: { size: 11 } } },
        y: {
          type: 'linear', position: 'left',
          min: 0, max: barAxisMax, ticks: { precision: 0, maxTicksLimit: 5 },
          grid: { color: '#EEF1F4' }
        },
        y1: {
          type: 'linear', position: 'right',
          min: 0, max: lineAxisMax, ticks: { precision: 0, maxTicksLimit: 5 },
          grid: { drawOnChartArea: false }
        }
      }
    }
  });
}

// ---- Right chart: compare two chosen years (Using-only bars + Total lines), per factory ----
function compareYearsData(section, yearA, yearB){
  const dataFor = (y)=> FACTORY_LIST.map(f=>{
    const rows = state.entries.filter(e=> entrySection(e)===section && e.factory===f && Number(e.year)===y);
    const using = rows.filter(e=>e.status==='Using').reduce((s,e)=> s + (Number(e.qty)||0), 0);
    const total = rows.reduce((s,e)=> s + (Number(e.qty)||0), 0);
    return { using, total };
  });
  const a = dataFor(yearA);
  const b = dataFor(yearB);
  return {
    labels: FACTORY_LIST,
    usingA: a.map(x=>x.using), usingB: b.map(x=>x.using),
    totalA: a.map(x=>x.total), totalB: b.map(x=>x.total)
  };
}

function buildCompareChart(canvasId, section, yearA, yearB){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const { labels, usingA, usingB, totalA, totalB } = compareYearsData(section, yearA, yearB);

  const datasets = [
    {
      type: 'bar', label: 'Using ' + yearA, data: usingA,
      backgroundColor: 'rgba(30,142,90,0.5)', borderRadius: 3, maxBarThickness: 26, yAxisID: 'y', order: 2,
      datalabels: BAR_DATALABELS
    },
    {
      type: 'bar', label: 'Using ' + yearB, data: usingB,
      backgroundColor: STATUS_COLORS['Using'], borderRadius: 3, maxBarThickness: 26, yAxisID: 'y', order: 2,
      datalabels: BAR_DATALABELS
    },
    {
      type: 'line', label: 'Total ' + yearA, data: totalA,
      borderColor: '#8FA6C2', backgroundColor: '#8FA6C2', borderWidth: 2, borderDash: [5,3],
      pointRadius: 4, pointHoverRadius: 5, pointBackgroundColor: '#8FA6C2', tension: 0.25, yAxisID: 'y1', order: 1,
      datalabels: LINE_DATALABELS('#5E7998')
    },
    {
      type: 'line', label: 'Total ' + yearB, data: totalB,
      borderColor: '#1B3A63', backgroundColor: '#1B3A63', borderWidth: 2.5,
      pointRadius: 4, pointHoverRadius: 5, pointBackgroundColor: '#1B3A63', tension: 0.25, yAxisID: 'y1', order: 1,
      datalabels: LINE_DATALABELS('#1B3A63')
    }
  ];

  // Same headroom trick as the left chart: bar axis gets extra ceiling so the total lines
  // (on their own axis) always trace above the bar tops.
  const maxBarVal = Math.max(1, ...usingA, ...usingB);
  const maxLineVal = Math.max(1, ...totalA, ...totalB);
  const barAxisMax = niceAxisMax(maxBarVal * 2.2);
  const lineAxisMax = niceAxisMax(maxLineVal * 1.15);

  if(summaryCharts[canvasId]){ summaryCharts[canvasId].destroy(); }
  summaryCharts[canvasId] = new Chart(canvas.getContext('2d'), {
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 10.5 }, boxWidth: 11, padding: 10 } },
        tooltip: { mode: 'index', intersect: false },
        dashedFactoryGrid: { enabled: true, color: '#C7CCD3', dash: [4,4] }
      },
      scales: {
        x: { grid: { display: false, drawTicks: false }, ticks: { font: { size: 11 } } },
        y: {
          type: 'linear', position: 'left',
          min: 0, max: barAxisMax, ticks: { precision: 0, maxTicksLimit: 5 },
          grid: { color: '#EEF1F4' }
        },
        y1: {
          type: 'linear', position: 'right',
          min: 0, max: lineAxisMax, ticks: { precision: 0, maxTicksLimit: 5 },
          grid: { drawOnChartArea: false }
        }
      }
    }
  });
}

// Fill a compare-year <select> with the given years, keeping the current selection if still valid.
function populateCompareYearSelect(selectId, years, defaultValue){
  const sel = document.getElementById(selectId);
  if(!sel) return;
  const current = sel.value;
  sel.innerHTML = years.map(y=>`<option value="${y}">${y}</option>`).join('');
  sel.value = (current && years.includes(Number(current))) ? current : String(defaultValue);
}

function getCompareYears(prefix){
  const yearA = Number(document.getElementById(prefix + 'CompareYearA').value);
  const yearB = Number(document.getElementById(prefix + 'CompareYearB').value);
  return { yearA, yearB };
}

const SUMMARY_CANVAS_IDS = ['workerCurrentYearChart','workerCompareChart','qcCurrentYearChart','qcCompareChart'];

function showSummaryLibError(show){
  SUMMARY_CANVAS_IDS.forEach(id=>{
    const canvas = document.getElementById(id);
    if(!canvas) return;
    const wrap = canvas.parentElement;
    let msg = wrap.querySelector('.summary-chart-error');
    if(show){
      canvas.style.display = 'none';
      if(!msg){
        msg = document.createElement('div');
        msg.className = 'summary-chart-error';
        msg.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;color:var(--warn);font-size:12.5px;text-align:center;padding:0 20px;';
        msg.textContent = 'Không tải được thư viện biểu đồ (Chart.js). Vui lòng kiểm tra kết nối mạng rồi bấm Refresh.';
        wrap.appendChild(msg);
      }
    }else{
      canvas.style.display = '';
      if(msg) msg.remove();
    }
  });
}

function renderSummaryCharts(){
  if(typeof Chart === 'undefined'){
    // Chart.js didn't load (e.g. blocked network / CDN unreachable) — show a clear message instead of a blank canvas.
    showSummaryLibError(true);
    return;
  }
  showSummaryLibError(false);
  try{
    const { prevYear, curYear } = summaryYearPair();
    document.getElementById('workerCurrentYearTitle').textContent = 'Worker Packing Chop Summary (' + curYear + ')';
    document.getElementById('qcCurrentYearTitle').textContent = 'QC Packing Chop Summary (' + curYear + ')';

    buildCurrentYearChart('workerCurrentYearChart', 'WORKER');
    buildCurrentYearChart('qcCurrentYearChart', 'QC');

    const workerYears = yearsInUseForSection('WORKER');
    populateCompareYearSelect('workerCompareYearA', workerYears, prevYear);
    populateCompareYearSelect('workerCompareYearB', workerYears, curYear);
    const w = getCompareYears('worker');
    buildCompareChart('workerCompareChart', 'WORKER', w.yearA, w.yearB);

    const qcYears = yearsInUseForSection('QC');
    populateCompareYearSelect('qcCompareYearA', qcYears, prevYear);
    populateCompareYearSelect('qcCompareYearB', qcYears, curYear);
    const q = getCompareYears('qc');
    buildCompareChart('qcCompareChart', 'QC', q.yearA, q.yearB);
  }catch(err){
    console.error('Summary chart render failed:', err);
  }
}

const SIGN_PASSWORD = 'kimjs2026';

function renderSignBox(){
  const box = document.getElementById('signStatus');
  const btn = document.getElementById('btnSign');

  if(state.signed && state.signatureDataUrl){
    // Signed & locked
    btn.style.display = 'none';
    box.innerHTML = `
      <div class="sig-preview">
        <img src="${state.signatureDataUrl}" alt="signature">
        <span class="sig-signed-label">✓ Signed</span>
      </div>
      <div class="lock-hint">🔒 Locked — unlock to edit</div>
      <button class="btn-unlock" id="btnUnlock" type="button">🔓 Unlock</button>
    `;
    document.getElementById('btnUnlock').onclick = ()=> doUnlock();
  }else if(state.comment){
    // Not signed, but a comment was left instead
    btn.style.display = 'none';
    box.innerHTML = `
      <div class="comment-box">
        <div class="comment-label">⚠ Not signed — Comment</div>
        <div class="comment-text">${escapeHtml(state.comment)}</div>
      </div>
      <div class="sign-choice-row" style="margin-top:6px;">
        <button class="btn-sign-done" id="btnRetrySign" type="button">✅ Sign now</button>
        <button class="btn-sign-comment" id="btnEditComment" type="button">✎ Edit</button>
      </div>
      <button class="btn-cancel-choice" id="btnClearComment" type="button">Clear comment</button>
    `;
    document.getElementById('btnRetrySign').onclick = ()=> doSignDone();
    document.getElementById('btnEditComment').onclick = ()=> showCommentInput();
    document.getElementById('btnClearComment').onclick = ()=>{
      if(confirm('Clear this comment?')){
        state.comment = null;
        saveState();
        renderSignBox();
      }
    };
  }else{
    // Nothing yet — show the initial Sign button
    btn.style.display = 'block';
    box.innerHTML = '';
  }
  applyLockState();
}

// Step 1: clicking the main Sign button offers two paths
document.getElementById('btnSign').addEventListener('click', ()=> showSignChoices());

function showSignChoices(){
  const box = document.getElementById('signStatus');
  document.getElementById('btnSign').style.display = 'none';
  box.innerHTML = `
    <div class="sign-choice-row">
      <button class="btn-sign-done" id="btnSignDone" type="button">✅ Done</button>
      <button class="btn-sign-comment" id="btnSignComment" type="button">✎ Not Sign w/Comment</button>
    </div>
    <button class="btn-cancel-choice" id="btnCancelChoice" type="button">Cancel</button>
  `;
  document.getElementById('btnSignDone').onclick = ()=> doSignDone();
  document.getElementById('btnSignComment').onclick = ()=> showCommentInput();
  document.getElementById('btnCancelChoice').onclick = ()=> renderSignBox();
}

// "Done" path — same password-protected signing as before
function doSignDone(){
  const pwd = prompt('Enter password to sign as Kim Joo Shik:');
  if(pwd === null){ renderSignBox(); return; }
  if(pwd !== SIGN_PASSWORD){
    alert('Incorrect password.');
    renderSignBox();
    return;
  }
  state.signed = true;
  state.signatureDataUrl = 'data:image/png;base64,' + SIGNATURE_IMAGE_BASE64;
  state.comment = null;
  saveState();
  renderSignBox();
}

// "Not Sign w/Comment" path — shows a comment box; the result is shown in the same box
function showCommentInput(){
  const box = document.getElementById('signStatus');
  document.getElementById('btnSign').style.display = 'none';
  box.innerHTML = `
    <textarea id="commentInput" rows="3" placeholder="Enter comment / reason for not signing...">${escapeHtml(state.comment || '')}</textarea>
    <div class="sign-choice-row" style="margin-top:6px;">
      <button class="btn-sign-comment" id="btnSubmitComment" type="button">Submit</button>
    </div>
    <button class="btn-cancel-choice" id="btnCancelComment" type="button">Cancel</button>
  `;
  document.getElementById('commentInput').focus();
  document.getElementById('btnSubmitComment').onclick = ()=>{
    const text = document.getElementById('commentInput').value.trim();
    if(!text){ alert('Please enter a comment.'); return; }
    state.signed = false;
    state.signatureDataUrl = null;
    state.comment = text;
    saveState();
    renderSignBox();
  };
  document.getElementById('btnCancelComment').onclick = ()=> renderSignBox();
}

// Unlock — same password as signing; removes the signature and unlocks the form
function doUnlock(){
  const pwd = prompt('Enter password to unlock (remove signature):');
  if(pwd === null) return;
  if(pwd !== SIGN_PASSWORD){
    alert('Incorrect password.');
    return;
  }
  if(confirm('Unlock the form? This will remove the current signature.')){
    state.signed = false;
    state.signatureDataUrl = null;
    saveState();
    renderSignBox();
  }
}

// ---- Lock the data-entry form once the sheet has been signed/approved ----
const LOCK_FIELD_IDS = ['fFactory','fYear','fStampName','fQty','fStatus','fReportBy'];
function applyLockState(){
  const locked = !!(state.signed && state.signatureDataUrl);

  LOCK_FIELD_IDS.forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.disabled = locked;
  });

  const addBtn = document.getElementById('btnAdd');
  if(addBtn){
    addBtn.disabled = locked;
    addBtn.style.opacity = locked ? '.55' : '';
    addBtn.style.cursor = locked ? 'default' : 'pointer';
  }

  if(receiverInput){
    receiverInput.disabled = locked;
    if(locked) hideReceiverDropdown();
  }

  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  const fiCam = document.getElementById('fileInputCamera');
  const btnCam = document.getElementById('btnTakePhoto');
  const btnUp = document.getElementById('btnUploadFile');
  if(dz){
    dz.classList.toggle('locked', locked);
    dz.style.opacity = locked ? '.55' : '';
  }
  if(fi) fi.disabled = locked;
  if(fiCam) fiCam.disabled = locked;
  if(btnCam) btnCam.disabled = locked;
  if(btnUp) btnUp.disabled = locked;

  document.querySelectorAll('.btn-del').forEach(btn=>{
    btn.disabled = locked;
    btn.style.opacity = locked ? '.4' : '';
    btn.style.cursor = locked ? 'default' : 'pointer';
  });
}

// ---- Add entry ----

document.getElementById('btnAdd').onclick = ()=>{
  const factory = document.getElementById('fFactory').value;
  const year = document.getElementById('fYear').value;
  const stamp_name = document.getElementById('fStampName').value.trim();
  const receiver = document.getElementById('fReceiver').value.trim();
  const qty = document.getElementById('fQty').value || 1;
  const status = document.getElementById('fStatus').value;

  if(!stamp_name && !pendingImage){
    alert('Please enter a Stamp name or upload an image before adding.');
    return;
  }

  const existingCount = state.entries.filter(e=>e.factory===factory && entrySection(e)===state.activeSection).length;
  const entry = {
    id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    factory, no: existingCount+1, stamp_name: stamp_name || '(see image)',
    receiver, dept: DEPT_FIXED, qty, status, year, section: state.activeSection
  };
  if(pendingImage){
    entry.imageDataUrl = pendingImage.dataUrl;
    entry.imgW = pendingImage.w;
    entry.imgH = pendingImage.h;
  }
  state.entries.push(entry);

  saveState();
  render();

  // reset entry fields (keep factory selection for faster consecutive entry)
  document.getElementById('fStampName').value = '';
  document.getElementById('fReceiver').value = '';
  document.getElementById('fQty').value = 1;
  document.getElementById('fStatus').selectedIndex = 0;
  document.getElementById('fYear').value = String(new Date().getFullYear());
  pendingImage = null;
  resetDropzone();
};

// ---- Receiver/ID search-select (backed by the employee directory) ----
const receiverInput = document.getElementById('fReceiver');
const receiverDropdown = document.getElementById('receiverDropdown');
let receiverActiveIndex = -1;
let receiverMatches = [];

function normalizeSearch(s){
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // strip Vietnamese diacritics
}

function searchEmployees(query){
  const q = normalizeSearch(query).trim();
  const factoryCode = document.getElementById('fFactory').value;
  const pool = EMPLOYEES.filter(emp => factoryLabelToCode(emp.factory) === factoryCode);
  if(!q) return [];
  return pool.filter(emp=>
    normalizeSearch(emp.name).includes(q) ||
    normalizeSearch(emp.id).includes(q)
  ).slice(0, 30);
}

function renderReceiverDropdown(matches){
  receiverMatches = matches;
  receiverActiveIndex = -1;
  if(matches.length === 0){
    receiverDropdown.innerHTML = '<div class="receiver-empty">No matching employee found</div>';
  }else{
    receiverDropdown.innerHTML = matches.map((emp, i)=>`
      <div class="receiver-option" data-idx="${i}">
        <div class="rname">${escapeHtml(emp.name)}</div>
        <div class="rmeta">${escapeHtml(emp.id)} • ${escapeHtml(emp.factory)}</div>
      </div>
    `).join('');
    receiverDropdown.querySelectorAll('.receiver-option').forEach(opt=>{
      opt.addEventListener('mousedown', e=>{
        e.preventDefault(); // keep focus so 'blur' hide doesn't fire before click
        selectReceiver(matches[Number(opt.dataset.idx)]);
      });
    });
  }
  receiverDropdown.classList.add('show');
}

function selectReceiver(emp){
  receiverInput.value = `${emp.name} / ${emp.id}`;
  const factoryCode = factoryLabelToCode(emp.factory);
  if(factoryCode){
    const sel = document.getElementById('fFactory');
    const found = Array.from(sel.options).some(o=>o.value===factoryCode);
    if(found) sel.value = factoryCode;
  }
  hideReceiverDropdown();
}

function hideReceiverDropdown(){
  receiverDropdown.classList.remove('show');
  receiverDropdown.innerHTML = '';
  receiverMatches = [];
  receiverActiveIndex = -1;
}

receiverInput.addEventListener('input', ()=>{
  if(receiverInput.disabled) return;
  const matches = searchEmployees(receiverInput.value);
  if(matches.length === 0 && !receiverInput.value.trim()){
    hideReceiverDropdown();
    return;
  }
  renderReceiverDropdown(matches);
});

receiverInput.addEventListener('focus', ()=>{
  if(receiverInput.disabled) return;
  if(receiverInput.value.trim()) renderReceiverDropdown(searchEmployees(receiverInput.value));
});

receiverInput.addEventListener('blur', ()=> hideReceiverDropdown());

// Changing Factory invalidates any previously picked receiver (they belong to the old factory),
// so clear the field and let the user re-search within the newly selected factory.
document.getElementById('fFactory').addEventListener('change', ()=>{
  receiverInput.value = '';
  hideReceiverDropdown();
});

receiverInput.addEventListener('keydown', e=>{
  if(!receiverDropdown.classList.contains('show') || receiverMatches.length === 0) return;
  const opts = receiverDropdown.querySelectorAll('.receiver-option');
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    receiverActiveIndex = Math.min(receiverActiveIndex + 1, opts.length - 1);
  }else if(e.key === 'ArrowUp'){
    e.preventDefault();
    receiverActiveIndex = Math.max(receiverActiveIndex - 1, 0);
  }else if(e.key === 'Enter'){
    if(receiverActiveIndex >= 0){
      e.preventDefault();
      selectReceiver(receiverMatches[receiverActiveIndex]);
    }
    return;
  }else if(e.key === 'Escape'){
    hideReceiverDropdown();
    return;
  }else{
    return;
  }
  opts.forEach((o,i)=> o.classList.toggle('active', i === receiverActiveIndex));
});

// ---- Image upload + OCR (in-browser, offline) ----
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileInputCamera = document.getElementById('fileInputCamera');
const btnTakePhoto = document.getElementById('btnTakePhoto');
const btnUploadFile = document.getElementById('btnUploadFile');
const ocrStatus = document.getElementById('ocrStatus');

dropzone.addEventListener('click', e=>{
  if(dropzone.classList.contains('locked')) return;
  if(e.target.closest('.dz-btn')) return; // buttons handle their own click
  fileInput.click();
});
btnTakePhoto.addEventListener('click', e=>{
  e.stopPropagation();
  if(!btnTakePhoto.disabled) fileInputCamera.click();
});
btnUploadFile.addEventListener('click', e=>{
  e.stopPropagation();
  if(!btnUploadFile.disabled) fileInput.click();
});
dropzone.addEventListener('dragover', e=>{ e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', ()=> dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e=>{
  e.preventDefault(); dropzone.classList.remove('drag');
  if(dropzone.classList.contains('locked')) return;
  if(e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e=>{
  if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
});
fileInputCamera.addEventListener('change', e=>{
  if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
});

function resetDropzone(){
  document.getElementById('dzHintText').textContent = '';
  document.getElementById('dzPreview').innerHTML = '';
  ocrStatus.className = 'ocr-status';
  fileInput.value = '';
  fileInputCamera.value = '';
}

function setOcrStatus(msg, type){
  ocrStatus.textContent = msg;
  ocrStatus.className = 'ocr-status show ' + type;
}

async function handleFile(file){
  if(!file.type.startsWith('image/')){
    alert('Please choose an image file.');
    return;
  }
  setOcrStatus('Preparing image...', 'loading');
  try{
    const { dataUrl, canvas } = await normalizeImage(file);
    document.getElementById('dzPreview').innerHTML = `<img src="${dataUrl}" alt="preview">`;
    document.getElementById('dzHintText').textContent = '✓ Image attached';

    // Small thumbnail kept for the table view and the Excel export
    const thumb = await makeThumbnail(canvas);
    pendingImage = thumb;

    const result = await ocrExtract(canvas, state.activeSection);
    if(result.factory){
      const sel = document.getElementById('fFactory');
      let found = Array.from(sel.options).some(o=>o.value===result.factory);
      if(!found){
        const o = document.createElement('option');
        o.value = result.factory; o.textContent = result.factory;
        sel.appendChild(o);
      }
      sel.value = result.factory;
    }
    if(result.stamp_name){
      document.getElementById('fStampName').value = result.stamp_name;
    }
    if(!result.factory && !result.stamp_name){
      setOcrStatus('Image attached. Text could not be auto-recognized — please fill in the fields manually.', 'err');
    }else{
      setOcrStatus(`✓ Detected: Factory ${result.factory || '?'} / Stamp name ${result.stamp_name || '?'} — please double-check before adding.`, 'ok');
    }
  }catch(err){
    console.error('OCR error:', err);
    setOcrStatus('Could not auto-read the image (' + (err && err.message ? err.message : 'unknown error') + ') — please enter the details manually below.', 'err');
  }
}

// Load the file as an image source, correctly applying EXIF rotation.
// Mobile camera photos carry an EXIF orientation flag; <img> display
// auto-rotates for viewing, but a plain new Image() + canvas.drawImage()
// does NOT reliably re-apply that rotation on many mobile browsers — the
// thumbnail looks upright while OCR silently reads a sideways image.
// createImageBitmap with imageOrientation:'from-image' fixes this consistently.
async function loadOrientedImageSource(file){
  if(typeof createImageBitmap === 'function'){
    try{
      return await createImageBitmap(file, { imageOrientation: 'from-image' });
    }catch(err){
      // fall through to the <img> fallback below
    }
  }
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Could not read the selected file'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Unsupported or corrupted image format'));
      img.onload = ()=> resolve(img);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Resize the uploaded image onto a canvas for preview + OCR input.
async function normalizeImage(file){
  const source = await loadOrientedImageSource(file);
  const MIN_DIM = 700;   // upscale small crops so OCR has enough detail
  const MAX_DIM = 1000;  // cap large phone photos — label text is large/bold, doesn't need more for speed
  let width = source.width, height = source.height;
  const maxSide = Math.max(width, height);
  let scale = 1;
  if(maxSide < MIN_DIM) scale = MIN_DIM / maxSide;
  else if(maxSide > MAX_DIM) scale = MAX_DIM / maxSide;
  width = Math.round(width * scale);
  height = Math.round(height * scale);

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, height);
  ctx.drawImage(source, 0, 0, width, height);
  if(source.close) source.close(); // release ImageBitmap memory
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  return { dataUrl, canvas };
}

// Small copy of the image kept in app storage + used in the Stamp name
// column (table) and embedded into the exported Excel file.
function makeThumbnail(sourceCanvas){
  return new Promise((resolve)=>{
    const MAX_W = 260;
    const scale = Math.min(1, MAX_W / sourceCanvas.width);
    const w = Math.round(sourceCanvas.width * scale);
    const h = Math.round(sourceCanvas.height * scale);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(sourceCanvas, 0, 0, w, h);
    resolve({ dataUrl: c.toDataURL('image/jpeg', 0.82), w, h });
  });
}

// In-browser OCR via Tesseract.js — no server/API call, so it works
// offline and regardless of how this file is opened.
let ocrWorkerPromise = null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise = Tesseract.createWorker('eng');
  }
  return ocrWorkerPromise;
}

// Convert to grayscale + Otsu auto-threshold (pure black/white).
// Phone photos of the fabric stamp label carry weave texture (moiré) and
// uneven lighting that confuses OCR inconsistently between the two lines —
// binarizing removes that texture noise and gives Tesseract a clean,
// high-contrast image regardless of shooting conditions.
function preprocessForOcr(sourceCanvas){
  const c = document.createElement('canvas');
  c.width = sourceCanvas.width;
  c.height = sourceCanvas.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(sourceCanvas, 0, 0);
  const imgData = ctx.getImageData(0, 0, c.width, c.height);
  const d = imgData.data;

  const n = d.length / 4;
  const gray = new Uint8ClampedArray(n);
  const hist = new Array(256).fill(0);
  for(let i = 0, j = 0; i < d.length; i += 4, j++){
    const v = (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]) | 0;
    gray[j] = v;
    hist[v]++;
  }

  // Otsu's method: pick the threshold that best separates ink from background.
  let sum = 0;
  for(let t = 0; t < 256; t++) sum += t * hist[t];
  let sumB = 0, wB = 0, varMax = 0, threshold = 127;
  for(let t = 0; t < 256; t++){
    wB += hist[t];
    if(wB === 0) continue;
    const wF = n - wB;
    if(wF === 0) break;
    sumB += t * hist[t];
    const mB = sumB / wB;
    const mF = (sum - sumB) / wF;
    const varBetween = wB * wF * (mB - mF) * (mB - mF);
    if(varBetween > varMax){ varMax = varBetween; threshold = t; }
  }

  for(let i = 0, j = 0; i < d.length; i += 4, j++){
    const v = gray[j] > threshold ? 255 : 0;
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
  return c;
}

async function ocrExtract(canvas, section){
  if(typeof Tesseract === 'undefined'){
    throw new Error('OCR engine failed to load — check your internet connection');
  }
  setOcrStatus('Reading image (first run may take a few seconds)...', 'loading');
  const worker = await getOcrWorker();
  await worker.setParameters({
    tessedit_ocr_engine_mode: '1', // LSTM only — skip the slower legacy engine
    tessedit_pageseg_mode: '6', // treat the label as one uniform block of text (2 short lines)
    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 -.:'
  });
  const ocrCanvas = preprocessForOcr(canvas);
  const { data } = await worker.recognize(ocrCanvas);
  const text = (data && data.text) ? data.text : '';
  return section === 'QC' ? parseQCStampLabelText(text) : parseStampLabelText(text);
}

// Heuristic parser for the two-line stamp label format, e.g.:
//   F1
//   PA - 1
function parseStampLabelText(rawText){
  const lines = rawText
    .split(/\r?\n/)
    .map(l => l.trim())
    .filter(l => l.length > 0);

  const factoryRegex = /\bF\s?-?\s?(\d{1,2})\b/i;
  let factory = '';

  for(const line of lines){
    const m = line.match(factoryRegex);
    if(m){ factory = 'F' + m[1]; break; }
  }
  if(!factory){
    const m = rawText.match(factoryRegex);
    if(m) factory = 'F' + m[1];
  }

  const candidates = lines.filter(line=>{
    const compact = line.replace(/\s+/g,'').toUpperCase();
    return compact !== factory && compact.length > 0;
  });
  let stamp_name = '';
  if(candidates.length){
    stamp_name = candidates.sort((a,b)=>b.length - a.length)[0];
  }

  return { factory, stamp_name };
}

// Heuristic parser for the QC Packing Chop label format, which flips the
// line order and packs the running number directly onto the Factory line
// (no separating space), e.g.:
//   PA
//   F3-2
// -> Factory = "F3" (from line 2), Stamp name = "PA-2" (letters-only code
//    line + trailing number on the factory line, joined with no spaces).
function parseQCStampLabelText(rawText){
  const lines = rawText
    .split(/\r?\n/)
    .map(l => l.trim())
    .filter(l => l.length > 0);

  const factoryRegex = /\bF\s?-?\s?(\d{1,2})\b/i;

  // Factory + running number are expected on line 2; fall back to
  // whichever line actually contains the factory code if OCR misreads
  // line breaks or inserts a stray noise line.
  let factoryLineIdx = -1;
  let fMatch = null;
  const preferredLine = lines[1];
  if(preferredLine){
    const m = preferredLine.match(factoryRegex);
    if(m){ factoryLineIdx = 1; fMatch = m; }
  }
  if(!fMatch){
    for(let i=0;i<lines.length;i++){
      const m = lines[i].match(factoryRegex);
      if(m){ factoryLineIdx = i; fMatch = m; break; }
    }
  }
  const factoryLine = factoryLineIdx >= 0 ? lines[factoryLineIdx] : '';

  const factory = fMatch ? ('F' + fMatch[1]) : '';

  // Trailing number = the last number on the factory line, found after
  // the factory code itself (e.g. "F3-2" -> 2, not the "3" in F3).
  let trailingNumber = '';
  if(fMatch){
    const afterFactory = factoryLine.slice(fMatch.index + fMatch[0].length);
    const nums = afterFactory.match(/\d+/g);
    if(nums && nums.length) trailingNumber = nums[nums.length - 1];
  }
  if(!trailingNumber && factoryLine){
    const allNums = factoryLine.match(/\d+/g);
    if(allNums && allNums.length > 1) trailingNumber = allNums[allNums.length - 1];
  }

  // The stamp code (e.g. "PA") is a short letters-only line — this skips
  // stray OCR noise (odd punctuation from the circular stamp border) that
  // isn't the factory line, and only falls back to "any other line" if no
  // clean letters-only candidate is found.
  const letterLineRegex = /^[A-Za-z]{1,6}$/;
  let codeLine = lines.find((l, i) => i !== factoryLineIdx && letterLineRegex.test(l));
  if(!codeLine){
    codeLine = lines.find((l, i) => i !== factoryLineIdx && l.length > 0) || '';
  }

  let stamp_name = '';
  if(codeLine && trailingNumber){
    stamp_name = `${codeLine}-${trailingNumber}`;
  }else if(codeLine){
    stamp_name = codeLine;
  }else if(trailingNumber){
    stamp_name = trailingNumber;
  }

  return { factory, stamp_name };
}

// ---- Export to Excel — one sheet per factory, respecting the active Factory/Year filter ----
document.getElementById('btnExport').onclick = async ()=>{
  const filteredRows = visibleSectionRows();
  const factories = factoriesInUse().filter(f => filteredRows.some(e=>e.factory===f));
  if(factories.length===0){
    alert('No data to export for the current filter. Please adjust Factory/Year or add a stamp.');
    return;
  }
  const btn = document.getElementById('btnExport');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Exporting...';

  try{
    await exportToExcel(factories);
  }catch(err){
    console.error('Export error:', err);
    alert('Export failed: ' + (err && err.message ? err.message : 'unknown error'));
  }finally{
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
};

async function exportToExcel(factories){
  const wb = new ExcelJS.Workbook();
  const exportDate = todayISO();
  const logoImageId = wb.addImage({ base64: LOGO_BASE64, extension: 'png' });

  const NAVY = 'FF1B3A63';
  const FONT_NAME = 'Times New Roman';
  const FONT_SIZE = 11;
  const CENTER = { horizontal: 'center', vertical: 'middle' };
  const CENTER_LEFT = { horizontal: 'left', vertical: 'middle' };
  const baseFont = { name: FONT_NAME, size: FONT_SIZE };
  const HEADER_FONT = { name: FONT_NAME, size: FONT_SIZE, bold: true, color: { argb: 'FFFFFFFF' } };
  const TITLE_FONT = { name: FONT_NAME, size: FONT_SIZE, bold: true };
  const LABEL_FONT = { name: FONT_NAME, size: FONT_SIZE, bold: true };
  const THIN = { style: 'thin', color: { argb: 'FF9AA5B1' } };

  // Stamp image: fixed 2.6cm (W) x 2.2cm (H). Row height follows the image.
  const CM_TO_PX = 37.7952756;
  const CM_TO_PT = 28.3464567;
  const IMG_W_PX = Math.round(2.6 * CM_TO_PX);
  const IMG_H_PX = Math.round(2.2 * CM_TO_PX);
  const IMG_ROW_HEIGHT_PT = 2.2 * CM_TO_PT;
  const STAMP_COL_WIDTH_CHARS = 15; // sized to closely frame the 2.6cm image
  const STAMP_COL_WIDTH_PX = Math.round(STAMP_COL_WIDTH_CHARS * 7 + 5);
  const IMG_COL_OFFSET_EMU = Math.max(0, Math.round(((STAMP_COL_WIDTH_PX - IMG_W_PX) / 2) * 9525));

  factories.forEach(factory=>{
    const rows = visibleSectionRows().filter(e=>e.factory===factory);
    const ws = wb.addWorksheet(factory);

    ws.columns = [
      { width: 6 },                      // A No.
      { width: STAMP_COL_WIDTH_CHARS },  // B Stamp name (image)
      { width: 26 },                     // C Receiver/ID
      { width: 12 },                     // D Dept.
      { width: 11 },                     // E Quantity
      { width: 16 }                      // F Status
    ];

    // Row 1: letterhead — logo (left) + form code in merged E1:F1 (no border on rows 1-3)
    ws.mergeCells('E1:F1');
    const codeCell = ws.getCell('E1');
    codeCell.value = FORM_CODE_LINES.join('\n');
    codeCell.alignment = { horizontal: 'left', vertical: 'middle', wrapText: true };
    codeCell.font = { name: FONT_NAME, size: 9 };
    ws.getRow(1).height = 50;

    ws.addImage(logoImageId, {
      tl: { col: 0, row: 0, colOff: 45000, rowOff: 45000 },
      ext: { width: 168, height: 58 }
    });

    // Row 2: Title
    ws.mergeCells('A2:F2');
    const titleCell = ws.getCell('A2');
    titleCell.value = 'STAMP DISTRIBUTION LIST';
    titleCell.font = TITLE_FONT;
    titleCell.alignment = CENTER;
    ws.getRow(2).height = 22;

    // Row 3: Date
    ws.getCell('A3').value = 'Date:';
    ws.getCell('A3').font = LABEL_FONT;
    ws.getCell('A3').alignment = CENTER;
    ws.getCell('B3').value = exportDate;
    ws.getCell('B3').font = baseFont;
    ws.getCell('B3').alignment = CENTER;
    ws.getRow(3).height = 18;

    // Row 4: table header
    const headerRowIdx = 4;
    const headers = ['No.', 'Stamp name', 'Receiver/ ID', 'Dept.', 'Quantity', 'Status'];
    const headerRow = ws.getRow(headerRowIdx);
    headers.forEach((h, i)=>{
      const cell = headerRow.getCell(i+1);
      cell.value = h;
      cell.font = HEADER_FONT;
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: NAVY } };
      cell.alignment = CENTER;
      cell.border = { top: THIN, bottom: THIN, left: THIN, right: THIN };
    });
    headerRow.height = 18;

    // Data rows
    let currentRow = headerRowIdx + 1;
    rows.forEach(r=>{
      const row = ws.getRow(currentRow);
      row.getCell(1).value = r.no;
      row.getCell(2).value = r.imageDataUrl ? '' : r.stamp_name;
      row.getCell(3).value = r.receiver;
      row.getCell(4).value = r.dept;
      row.getCell(5).value = r.qty;
      row.getCell(6).value = r.status;
      row.eachCell({ includeEmpty: true }, c=>{
        c.font = baseFont;
        c.alignment = CENTER;
        c.border = { bottom: THIN, left: THIN, right: THIN };
      });
      row.getCell(3).alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };

      if(r.imageDataUrl){
        row.height = IMG_ROW_HEIGHT_PT;
        const imgId = wb.addImage({ base64: r.imageDataUrl, extension: 'jpeg' });
        ws.addImage(imgId, {
          tl: { col: 1, row: currentRow - 1, colOff: IMG_COL_OFFSET_EMU, rowOff: 0 },
          ext: { width: IMG_W_PX, height: IMG_H_PX }
        });
      }else{
        row.height = 18;
      }
      currentRow++;
    });

    // Footer: Report by / Approved by / signature / name
    currentRow += 1;
    ws.mergeCells(`B${currentRow}:C${currentRow}`);
    const reportCell = ws.getCell(`B${currentRow}`);
    reportCell.value = 'Report by: ' + (state.reportBy || '');
    reportCell.font = baseFont;
    reportCell.alignment = CENTER;

    ws.mergeCells(`D${currentRow}:F${currentRow}`);
    const approvedLabelCell = ws.getCell(`D${currentRow}`);
    approvedLabelCell.value = 'Approved by:';
    approvedLabelCell.font = LABEL_FONT;
    approvedLabelCell.alignment = CENTER;

    // Signature row — sits below "Approved by:" and above the printed name
    currentRow += 1;
    const sigRowIdx = currentRow;
    ws.mergeCells(`D${sigRowIdx}:F${sigRowIdx}`);
    if(state.signed && state.signatureDataUrl){
      ws.getRow(sigRowIdx).height = 36;
      const sigImgId = wb.addImage({ base64: state.signatureDataUrl, extension: 'png' });
      const sigW = 110, sigH = 44;
      const dCol = ws.getColumn(4);
      const dWidthPx = Math.round((dCol.width || 12) * 7 + 5);
      const eWidthPx = Math.round((ws.getColumn(5).width || 11) * 7 + 5);
      const fWidthPx = Math.round((ws.getColumn(6).width || 16) * 7 + 5);
      const mergedWidthPx = dWidthPx + eWidthPx + fWidthPx;
      const sigColOff = Math.max(0, Math.round(((mergedWidthPx - sigW) / 2) * 9525));
      ws.addImage(sigImgId, {
        tl: { col: 3, row: sigRowIdx - 1, colOff: sigColOff, rowOff: 0 },
        ext: { width: sigW, height: sigH }
      });
    }else if(state.comment){
      ws.getRow(sigRowIdx).height = 26;
      const commentCell = ws.getCell(`D${sigRowIdx}`);
      commentCell.value = 'Not signed — Comment: ' + state.comment;
      commentCell.font = { name: FONT_NAME, size: 9, italic: true, color: { argb: 'FFB7791F' } };
      commentCell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    }else{
      ws.getRow(sigRowIdx).height = 26;
    }

    // Printed name
    currentRow += 1;
    ws.mergeCells(`D${currentRow}:F${currentRow}`);
    const nameCell = ws.getCell(`D${currentRow}`);
    nameCell.value = APPROVER_NAME;
    nameCell.font = { name: FONT_NAME, size: FONT_SIZE, bold: true };
    nameCell.alignment = CENTER;
  });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const sectionLabel = state.activeSection === 'QC' ? 'QC_Packing_Chop' : 'Worker_Packing_Chop';
  a.download = `${sectionLabel}_${exportDate}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

Promise.all([loadReceivers(), loadState(), getOcrWorker()]);
