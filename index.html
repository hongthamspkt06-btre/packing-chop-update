<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Packing Chop</title>
<style>
  :root{
    --navy:#1B3A63;
    --blue-accent:#2E6FB5;
    --bg:#D5D8DC;
    --card:#ffffff;
    --text:#1F2937;
    --muted:#6B7280;
    --border:#E2E5E9;
    --good:#1E8E5A;
    --warn:#C0392B;
    --amber:#B7791F;
    /* --- Sign Status panel palette (aliases so the panel CSS below can stay
       close to the reusable sign-status-approval-panel skill) --- */
    --green:#1E8E5A;
    --green-dim:#E7F5EC;
    --red:#C0392B;
    --red-dim:#FBEAEA;
    --amber-dim:#F6ECD9;
    --panel2:#F7F9FB;
    --sub:#6B7280;
    --mono:Consolas,"SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
    padding-top:4.76mm; /* khoảng cách xám giữa mép trên trang và khối header */
  }
  .wrap{max-width:1180px;margin:0 auto;}
  header{
    background:var(--navy);
    color:#fff;
    border-radius:10px;
    padding:10.5px 26px; /* giảm từ 20px -> ~15mm tổng chiều cao ô */
    margin-bottom:4.76mm; /* khoảng cách khối header đến khối Worker Packing Chop */
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
  }
  header h1{margin:0;font-size:19px;letter-spacing:.3px;}
  header .sub{font-size:12px;color:#B9C7D9;margin-top:4px;}
  header .actions{display:flex;gap:10px;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:7px;
    padding:10px 16px;
    font-size:13px;
    font-weight:600;
    transition:.15s;
  }
  .btn-primary{background:var(--blue-accent);color:#fff;}
  .btn-primary:hover{background:#255a94;}
  .btn-export{background:#1E8E5A;color:#fff;}
  .btn-export:hover{background:#166b44;}
  .btn-export:disabled{background:#9BB;opacity:.6;cursor:default;}
  /* Nút Refresh: giảm chiều cao còn ~8.9mm (~33.6px), bằng chiều cao ô "Worker Packing Chop" (padding 9px + font 13px) */
  #btnRefreshSummary{padding:9px 16px;}
  .btn-del{background:#F5E4E2;color:var(--warn);padding:5px 9px;font-size:12px;font-weight:600;}
  .btn-del:hover{background:#eecdc9;}

  .tab-bar{
    display:flex;align-items:center;gap:8px;margin-bottom:4.76mm; /* khoảng cách khối Worker Packing Chop đến khối trắng */
  }
  .tab-single{
    padding:9px 20px;background:var(--navy);color:#fff;border-radius:8px;
    font-size:13px;font-weight:700;letter-spacing:.2px;
  }
  .tab-single .count{
    display:inline-block;margin-left:8px;font-size:12px;
    background:rgba(255,255,255,.22);border-radius:10px;padding:1px 7px;
  }
  .tab-btn{
    padding:9px 20px;background:#EEF1F4;color:var(--navy);border-radius:8px;
    font-size:13px;font-weight:700;letter-spacing:.2px;cursor:pointer;transition:.15s;
  }
  .tab-btn:hover{background:#E2E7EC;}
  .tab-btn.active{background:var(--navy);color:#fff;}
  .tab-btn .count{
    display:inline-block;margin-left:8px;font-size:12px;
    background:rgba(0,0,0,.08);border-radius:10px;padding:1px 7px;
  }
  .tab-btn.active .count{background:rgba(255,255,255,.22);}

  .grid{display:grid;grid-template-columns:340px 1fr;gap:18px;}
  @media(max-width:860px){.grid{grid-template-columns:1fr;}}

  .card{
    background:var(--card);
    border-radius:10px;
    padding:18px 20px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .card h2{margin:0 0 14px;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;}

  .dropzone{
    border:2px dashed #A9BBD1;
    border-radius:8px;
    padding:20px 14px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    transition:.15s;
    background:#F7F9FB;
  }
  .dropzone.drag{border-color:var(--blue-accent);background:#EAF2FA;}
  .dropzone.locked{cursor:default;}
  .dropzone img{max-width:100%;max-height:108px;border-radius:6px;margin-bottom:8px;}
  .dropzone .hint{font-size:12px;color:#94A3B8;margin-top:4px;}

  .dz-actions{display:flex;gap:8px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap;}
  .dz-btn{
    background:#fff;color:var(--blue-accent);border:1px solid var(--blue-accent);
    padding:7px 12px;border-radius:6px;font-size:12px;font-weight:600;
  }
  .dz-btn:hover{background:#EAF2FA;}
  .dz-btn:disabled{opacity:.5;cursor:default;background:#F2F4F6;color:var(--muted);border-color:var(--border);}
  .btn-signoff{background:var(--blue-accent);color:#fff;border:1px solid var(--blue-accent);display:inline-flex;align-items:center;gap:6px;}
  .btn-signoff:hover{background:#255a94;}
  .btn-signoff:disabled{opacity:.5;cursor:default;background:#B9C7D9;border-color:#B9C7D9;color:#fff;}
  .btn-signoff svg{width:13px;height:13px;flex:0 0 auto;}
  .btn-confirm{background:var(--blue-accent);color:#fff;border:1px solid var(--blue-accent);}
  .btn-confirm:hover{background:#255a94;}
  .btn-approve{background:var(--green);color:#fff;border:1px solid var(--green);}
  .btn-approve:hover{background:#166b45;}
  .btn-notsign{background:var(--red);color:#fff;border:1px solid var(--red);}
  .btn-notsign:hover{background:#9c2e21;}
  .btn-cancel-plain{background:none;border:none;color:#B0B4BA;text-decoration:underline;padding:7px 10px;font-size:12px;font-weight:600;}
  .btn-cancel-plain:hover{color:#8A8F96;}
  .btn-unlock{background:#F1F2F4;color:var(--text);border:1px solid #E2E5E9;border-radius:999px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .btn-unlock:hover{background:#E7E9EC;}

  /* ===== Sign Status / Approval panel (ported from sign-status-approval-panel skill) ===== */
  .lock-notice{
    background:var(--amber-dim);color:var(--amber);border-radius:6px;padding:8px 10px;
    font-size:12px;font-weight:600;margin-bottom:12px;
  }
  input:disabled,select:disabled,textarea:disabled{background:#F2F4F6;color:var(--muted);cursor:default;}
  .dropzone.locked{opacity:.6;}

  .status-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.03em;}
  .status-pending{background:var(--amber-dim);color:var(--amber);}
  .status-approved{background:var(--green-dim);color:var(--green);}
  .status-rejected{background:var(--red-dim);color:var(--red);}

  .approval-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .approval-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .sig-stamp{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;}
  .sig-stamp img{height:42px;}
  .sig-meta{font-size:12px;color:var(--sub);line-height:1.5;font-family:var(--mono);}
  .sig-meta b{color:var(--text);font-family:inherit;}

  .confirm-box{display:flex;align-items:center;gap:10px;background:var(--amber-dim);border:1px solid #f0d19c;border-radius:8px;padding:8px 12px;flex-wrap:wrap;}
  .confirm-box span{font-size:12px;color:var(--amber);font-weight:600;}
  .confirm-box input[type=password]{width:130px;}
  .confirm-box.reject-box{background:var(--red-dim);border-color:#f3c6c2;flex-direction:column;align-items:stretch;gap:8px;}
  .confirm-box.reject-box span{color:var(--red);}
  .confirm-box textarea{width:100%;min-height:56px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;color:var(--text);resize:vertical;}
  .reject-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pw-error{font-size:12px;color:var(--red);font-weight:600;}
  .approval-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}

  .ocr-status{
    margin-top:10px;font-size:12px;padding:8px 10px;border-radius:6px;display:none;
  }
  .ocr-status.show{display:block;}
  .ocr-status.loading{background:#EEF3FA;color:var(--blue-accent);}
  .ocr-status.ok{background:#E7F5EC;color:var(--good);}
  .ocr-status.err{background:#FBEAEA;color:var(--warn);}

  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600;}
  input[type=text],input[type=number],select{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;
    font-size:13px;font-family:inherit;color:var(--text);background:#fff;
  }
  input:focus,select:focus{outline:2px solid #BBD3EC;border-color:var(--blue-accent);}
  select:required:invalid{color:var(--muted);} /* placeholder mờ (vd "e.g. F1") khi chưa chọn Factory, giống input::placeholder */
  select option{color:var(--text);} /* các option trong dropdown vẫn hiển thị màu chữ bình thường */

  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{
    background:#DCEAF7;color:var(--navy);text-align:left;padding:9px 10px;
    font-size:12px;font-weight:700;text-transform:none;letter-spacing:.2px;
    border-bottom:2px solid #B9CFE8;
  }
  td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#F7F9FB;}
  .empty-row td{text-align:center;color:var(--muted);padding:30px;font-style:italic;}

  .stamp-cell{display:flex;align-items:center;gap:8px;}
  .stamp-thumb{
    width:44px;height:44px;object-fit:cover;border-radius:6px;
    border:1px solid var(--border);background:#F7F9FB;flex-shrink:0;
  }
  .stamp-thumb-empty{
    width:44px;height:44px;border-radius:6px;border:1px dashed var(--border);
    background:#F7F9FB;flex-shrink:0;
  }
  .stamp-name-text{font-weight:600;}

  .factory-chip{
    display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700;
    background:#EAF2FA;color:var(--blue-accent);
  }
  .status-pill{
    display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;
  }
  .pill-ok{background:#E7F5EC;color:var(--good);}
  .pill-bad{background:#FBEAEA;color:var(--warn);}
  .pill-default{background:#EEF1F4;color:var(--muted);}
  .pill-info{background:#EAF2FA;color:var(--blue-accent);}

  .summary-section{display:none;}
  .summary-card{
    background:var(--card);
    border-radius:10px;
    padding:20px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    margin-bottom:18px;
  }
  .summary-card h2{margin:0 0 4px;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;}
  .summary-card .summary-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .summary-chart-wrap{position:relative;height:261px;}

  .summary-pair{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px;}
  .summary-chart-card{flex:1 1 320px;min-width:280px;margin-bottom:0;}
  .summary-chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .summary-chart-head h2{margin-bottom:0;}
  .summary-year-compare{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .summary-year-compare select{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff;color:var(--navy);}

  .top-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;}
  .top-row .field{flex:1;min-width:140px;}
  .top-row label{margin-top:0;}

  #commentInput{width:100%;font-family:inherit;font-size:12px;padding:7px 8px;border:1px solid var(--border);border-radius:6px;resize:vertical;}

  /* Receiver/ID search-select */
  .receiver-wrap{position:relative;}
  .receiver-dropdown{
    position:absolute;left:0;right:0;top:calc(100% + 2px);
    background:#fff;border:1px solid var(--border);border-radius:7px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:230px;overflow-y:auto;
    z-index:50;display:none;
  }
  .receiver-dropdown.show{display:block;}
  .receiver-option{
    padding:8px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border);
  }
  .receiver-option:last-child{border-bottom:none;}
  .receiver-option:hover,.receiver-option.active{background:#EAF2FA;}
  .receiver-option .rname{font-weight:600;color:var(--text);}
  .receiver-option .rmeta{font-size:11px;color:var(--muted);margin-top:2px;}
  .receiver-empty{padding:10px;text-align:center;font-size:12px;color:var(--muted);font-style:italic;}

  .table-wrap{overflow-x:auto;overflow-y:auto;max-height:505px;position:relative;}
  .table-wrap table{border-collapse:separate;border-spacing:0;}
  .table-wrap thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 rgba(0,0,0,.08);}
  footer{margin-top:16px;text-align:center;font-size:12px;color:#8592A3;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>PACKING CHOP UPDATE</h1>
    </div>
    <div class="actions">
      <button class="btn-export" id="btnExport">⭳ Export Excel</button>
    </div>
  </header>

  <div class="tab-bar">
    <div class="tab-btn active" id="tabWorker" data-section="WORKER">Worker Packing Chop<span class="count" id="totalCountWorker">0</span></div>
    <div class="tab-btn" id="tabQC" data-section="QC">QC Packing Chop<span class="count" id="totalCountQC">0</span></div>
    <div class="tab-btn" id="tabSummary" data-section="SUMMARY">Summary</div>
    <button class="btn-export" id="btnRefreshSummary" style="margin-left:auto;">⟳ Refresh</button>
  </div>

  <div class="grid" id="sectionGrid">
    <!-- LEFT: input card -->
    <div class="card">
      <h2>Add new stamp</h2>
      <div class="lock-notice" id="lockNotice" style="display:none;"></div>

      <div class="dropzone" id="dropzone">
        <div id="dzContent">
          <div id="dzHintText"></div>
          <div id="dzPreview"></div>
          <div class="dz-actions">
            <button type="button" class="dz-btn" id="btnTakePhoto">📷 Take Photo</button>
            <button type="button" class="dz-btn" id="btnUploadFile">🖼 Upload from Device</button>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
        <input type="file" id="fileInputCamera" accept="image/*" capture="environment" style="display:none;">
      </div>
      <div class="ocr-status" id="ocrStatus"></div>

      <label>Year</label>
      <select id="fYear"></select>

      <label>Factory</label>
      <select id="fFactory" required style="color:var(--muted);">
        <option value="" disabled selected hidden>e.g. F1</option>
        <option value="F1">F1</option>
        <option value="F2">F2</option>
        <option value="F3">F3</option>
        <option value="F4">F4</option>
        <option value="F6">F6</option>
        <option value="F7">F7</option>
      </select>

      <label>Stamp name</label>
      <input type="text" id="fStampName" placeholder="e.g. PA - 1">

      <label>Receiver / ID</label>
      <div class="receiver-wrap">
        <input type="text" id="fReceiver" placeholder="Type name or ID to search..." autocomplete="off">
        <div class="receiver-dropdown" id="receiverDropdown"></div>
      </div>

      <label>Quantity</label>
      <input type="number" id="fQty" min="0" value="1">

      <label>Status</label>
      <select id="fStatus">
        <option value="Using">Using</option>
        <option value="Broken">Broken</option>
        <option value="Lost">Lost</option>
        <option value="Usable/Not Use">Usable/Not Use</option>
      </select>

      <button class="btn-primary" id="btnAdd" style="width:100%;margin-top:16px;">+ Add to list</button>
    </div>

    <!-- RIGHT: master table across all factories -->
    <div class="card">
      <div class="top-row">
        <div class="field" style="max-width:110px;min-width:90px;">
          <label>Year</label>
          <select id="fFilterYear">
            <option value="ALL">All</option>
          </select>
        </div>
        <div class="field" style="max-width:160px;">
          <label>Factory</label>
          <select id="fFilter">
            <option value="ALL">All</option>
          </select>
        </div>
        <div class="field" style="max-width:220px;">
          <label>Report by</label>
          <input type="text" id="fReportBy" placeholder="Reporter name">
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:50px;">Factory</th>
              <th style="width:38px;">No.</th>
              <th>Stamp Name</th>
              <th>Receiver/ID</th>
              <th>Dept.</th>
              <th style="width:60px;">Qty</th>
              <th>Status</th>
              <th style="width:44px;"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Sign Status / Approval panel — shown at the bottom of Worker Packing Chop and QC
       Packing Chop tabs (hidden on Summary). Content is built by renderApprovalRow(). -->
  <div class="card" id="signPanelCard" style="margin-top:18px;display:none;">
    <h2>Sign Status</h2>
    <div class="approval-row" id="approvalRow"></div>
  </div>

  <div class="summary-section" id="sectionSummary">
    <div class="summary-pair">
      <div class="summary-card summary-chart-card">
        <h2 id="workerCurrentYearTitle">Worker Packing Chop Summary</h2>
        <div class="summary-chart-wrap"><canvas id="workerCurrentYearChart"></canvas></div>
      </div>
      <div class="summary-card summary-chart-card">
        <div class="summary-chart-head">
          <h2>Worker Packing Chop Comparison</h2>
          <div class="summary-year-compare">
            <select id="workerCompareYearA"></select>
            <span>vs</span>
            <select id="workerCompareYearB"></select>
          </div>
        </div>
        <div class="summary-chart-wrap"><canvas id="workerCompareChart"></canvas></div>
      </div>
    </div>
    <div class="summary-pair">
      <div class="summary-card summary-chart-card">
        <h2 id="qcCurrentYearTitle">QC Packing Chop Summary</h2>
        <div class="summary-chart-wrap"><canvas id="qcCurrentYearChart"></canvas></div>
      </div>
      <div class="summary-card summary-chart-card">
        <div class="summary-chart-head">
          <h2>QC Packing Chop Comparison</h2>
          <div class="summary-year-compare">
            <select id="qcCompareYearA"></select>
            <span>vs</span>
            <select id="qcCompareYearB"></select>
          </div>
        </div>
        <div class="summary-chart-wrap"><canvas id="qcCompareChart"></canvas></div>
      </div>
    </div>
  </div>

</div>

<script>
// ---- Lazy-load heavy third-party libraries only when actually used ----
// ExcelJS, Tesseract.js and Chart.js(+datalabels) are each hundreds of KB to a few MB.
// Loading them eagerly in <head> used to block the page from becoming interactive.
// Instead we inject <script> tags on demand, right before each feature is first used
// (Export -> ExcelJS, photo OCR -> Tesseract, Summary tab -> Chart.js), so the form
// and table render immediately.
const _scriptCache = {};
function loadScriptOnce(src){
  if(!_scriptCache[src]){
    _scriptCache[src] = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = src;
      s.onload = ()=> resolve();
      s.onerror = ()=> { delete _scriptCache[src]; reject(new Error('Failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }
  return _scriptCache[src];
}
function ensureExcelJS(){
  return loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
}
function ensureTesseract(){
  return loadScriptOnce('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
}
let _chartLibPromise = null;
function ensureChartLib(){
  if(!_chartLibPromise){
    _chartLibPromise = loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js')
      .then(()=> loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js'))
      .then(()=>{
        if(typeof Chart !== 'undefined' && typeof ChartDataLabels !== 'undefined' && !Chart._datalabelsRegistered){
          Chart.register(ChartDataLabels);
          Chart._datalabelsRegistered = true;
        }
        // dashedFactoryGridPlugin itself is passed directly into each `new Chart(...)` call
        // (see buildCurrentYearChart / buildCompareChart) instead of being globally registered
        // here — a global Chart.register() depends on script-load timing that behaved
        // differently once deployed to a live URL vs. opening the file locally, which silently
        // dropped the dashed factory-separator lines. Per-instance plugins have no such timing
        // dependency.
      });
  }
  return _chartLibPromise;
}

// Employee directory (Factory / ID / Full Name) — used to power the
// Receiver/ID search-select in the "Add new stamp" form.
// URL Web App Apps Script trả danh sách receiver (xem ReceiverAPI.gs)
const RECEIVER_API_URL = 'https://script.google.com/macros/s/AKfycbwdjAjNJUlahqDgX1QKyA9Ye7V1dh4pvoxcxOSC_wpJF6wQSzVMMKLhvV8keLc5Qhsu/exec';
// Backend chính (Entries/Meta/ảnh) dùng CHUNG 1 GAS project với Receiver List,
// nên trỏ về cùng URL. Nếu sau này tách deployment riêng, chỉ cần đổi hằng số này.
const API_URL = RECEIVER_API_URL;

let EMPLOYEES = []; // được nạp động qua loadReceivers() khi trang khởi động

async function loadReceivers(){
  try{
    const res = await fetch(`${RECEIVER_API_URL}?action=getReceivers`);
    EMPLOYEES = await res.json();
  }catch(e){
    console.error('Không tải được danh sách receiver:', e);
    EMPLOYEES = [];
  }
}

async function loadState(){
  try{
    const res = await fetch(`${API_URL}?action=load`);
    const data = await res.json();
    if(data && !data.error){
      state.entries = data.entries || [];
      state.reportBy = data.reportBy || "";
      // Sign Status của cả 2 tab được gộp sẵn trong response action=load (xem loadState()
      // trong Entries.gs) — KHÔNG gọi thêm request riêng, để trang vẫn chỉ tốn 1 round-trip.
      if(data.sign){ state.sign = data.sign; }

      // Sheet chỉ lưu imageFileId/imageUrl (ảnh nằm trên Drive), không lưu
      // base64 trực tiếp trong ô để tránh vượt giới hạn dung lượng cell.
      // Ở đây tải lại base64 cho các dòng có ảnh để hiển thị thumbnail
      // và phục vụ xuất Excel (ExcelJS cần base64, không dùng được URL).
      // Gộp thành 1 lần gọi bulk duy nhất (thay vì 1 request riêng cho mỗi
      // ảnh) -> đây chính là nguyên nhân trang mất ~2 phút để load khi có
      // nhiều dòng có ảnh (mỗi round-trip tới Apps Script tốn ~1-2s).
      const idsToFetch = Array.from(new Set(
        state.entries
          .filter(en => !en.imageDataUrl && en.imageFileId)
          .map(en => en.imageFileId)
      ));
      if(idsToFetch.length){
        try{
          const r = await fetch(`${API_URL}?action=imageBase64Bulk&fileIds=${encodeURIComponent(idsToFetch.join(','))}`);
          const j = await r.json();
          const images = (j && j.images) || {};
          state.entries.forEach(en => {
            if(!en.imageDataUrl && en.imageFileId && images[en.imageFileId]){
              en.imageDataUrl = images[en.imageFileId];
            }
          });
        }catch(imgErr){
          console.error('Không tải được ảnh (bulk):', imgErr);
        }
      }
    }else if(data && data.error){
      console.error('loadState backend error:', data.error);
    }
  }catch(e){
    console.error('loadState failed', e);
  }
  document.getElementById('fReportBy').value = state.reportBy;
  populateYearSelect();
  updateFactoryPlaceholderColor();
  render();
}
async function saveState(){
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      // dùng text/plain để tránh trình duyệt gửi preflight OPTIONS
      // (Apps Script Web App không xử lý OPTIONS -> sẽ báo lỗi CORS)
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'save',
        entries: state.entries,
        reportBy: state.reportBy
      })
    });
    const data = await res.json();
    if(data && data.entries){
      // Backend trả lại entries kèm imageFileId/imageUrl cho ảnh vừa upload
      // lên Drive. Giữ lại imageDataUrl đang có ở local (không cần tải lại
      // ngay ảnh vừa lưu xong).
      const localImages = {};
      state.entries.forEach(en=>{ if(en.imageDataUrl) localImages[en.id] = en.imageDataUrl; });
      state.entries = data.entries.map(en => Object.assign({}, en, {
        imageDataUrl: localImages[en.id] || en.imageDataUrl
      }));
    }
    if(data && data.error){
      console.error('saveState backend error:', data.error);
      alert('Lưu dữ liệu thất bại: ' + data.error);
    }
    if(data && data.uploadErrors && data.uploadErrors.length){
      console.error('uploadErrors:', data.uploadErrors);
      alert('Đã lưu dữ liệu, nhưng có ảnh bị lỗi upload:\n' + data.uploadErrors.join('\n'));
    }
  }catch(e){
    console.error('save failed', e);
    alert('Không kết nối được tới server để lưu dữ liệu. Vui lòng thử lại.');
  }
}

// ============================================================
// Sign Status / Approval panel (ported from sign-status-approval-panel skill)
// State machine: Pending -> (password) -> Approved / Not Sign w/Comment -> Signed off /
// Not signed -> (password) -> Unlock -> Pending. WORKER và QC có trạng thái độc lập,
// namespaced bởi `section` (đọc từ state.activeSection tại thời điểm thao tác).
// ============================================================

// 1 hàm chung gửi 1 request POST duy nhất tới action sign/unlock/reject — cùng API_URL
// và cùng pattern "server tự đọc-sửa-ghi, trả về toàn bộ state mới nhất" như saveState().
async function applyDeltaSign(action, payload){
  const section = state.activeSection;
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, section }, payload))
    });
    const data = await res.json();
    if(data && data.sign){ state.sign = data.sign; }
    if(data && data.error){
      console.error('sign action backend error:', data.error);
      alert('Thao tác Sign Status thất bại: ' + data.error);
    }
  }catch(e){
    console.error('sign action failed', e);
    alert('Không kết nối được tới server để cập nhật Sign Status. Vui lòng thử lại.');
  }
  render();
}

function fmtSignDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso);
  const pad = n=> String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function buildApprovalLeftHtml(section){
  const s = state.sign[section] || {};
  if(s.approved){
    return `
      <span class="status-badge status-approved">&#10003; SIGNED OFF</span>
      <div class="sig-stamp">
        <img src="${SIG_IMG}" alt="Signature">
        <div class="sig-meta"><b>${escapeHtml(s.approvedBy || APPROVER_NAME)}</b><br>${fmtSignDateTime(s.approvedAt)}</div>
      </div>`;
  }
  if(s.rejected){
    return `
      <span class="status-badge status-rejected">&#10007; NOT SIGNED</span>
      ${s.rejectComment ? `<span class="sig-meta">&ldquo;${escapeHtml(s.rejectComment)}&rdquo;</span>` : ''}`;
  }
  return `
    <span class="status-badge status-pending">&#9679; PENDING SIGN-OFF</span>
    <span style="font-size:12px;color:var(--sub);">QA Senior Manager: ${escapeHtml(APPROVER_NAME)}</span>`;
}

function buildApprovalRightHtml(section){
  const s = state.sign[section] || {};
  const locked = !!(s.approved || s.rejected);
  const ui = state.signUI;

  if(locked && ui.confirmingUnlock){
    return `
      <div class="confirm-box">
        <span>Enter password to unlock:</span>
        <input type="password" id="pwFieldUnlock" value="${escapeHtml(ui.pwInput)}">
        <button class="dz-btn btn-confirm" id="unlockYes">Confirm</button>
        <button class="dz-btn btn-cancel-plain" id="unlockNo">Cancel</button>
        ${ui.pwError ? `<span class="pw-error">${escapeHtml(ui.pwError)}</span>` : ''}
      </div>`;
  }
  if(locked){
    return `<button class="dz-btn btn-unlock" id="unlockBtn">🔒 Unlock</button>`;
  }
  if(ui.confirmingSign){
    return `
      <div class="confirm-box">
        <span>Enter password to sign off:</span>
        <input type="password" id="pwField" value="${escapeHtml(ui.pwInput)}">
        <button class="dz-btn btn-confirm" id="signYes">Confirm</button>
        <button class="dz-btn btn-cancel-plain" id="signNo">Cancel</button>
        ${ui.pwError ? `<span class="pw-error">${escapeHtml(ui.pwError)}</span>` : ''}
      </div>`;
  }
  if(ui.showSignOffActions && ui.confirmingReject){
    return `
      <div class="confirm-box reject-box">
        <span>Reason for not signing:</span>
        <textarea id="rejectCommentField" placeholder="Enter comment...">${escapeHtml(ui.rejectComment)}</textarea>
        <div class="reject-actions">
          <button class="dz-btn" id="rejectYes">Submit</button>
          <button class="dz-btn btn-cancel-plain" id="rejectCancelBtn">Cancel</button>
        </div>
        ${ui.pwError ? `<span class="pw-error">${escapeHtml(ui.pwError)}</span>` : ''}
      </div>`;
  }
  if(ui.showSignOffActions){
    return `
      <div class="approval-actions">
        <button class="dz-btn btn-approve" id="approveBtn">Approved</button>
        <button class="dz-btn btn-notsign" id="notSignBtn">Not Sign w/Comment</button>
        <button class="dz-btn btn-cancel-plain" id="cancelActionBtn">Cancel</button>
      </div>`;
  }
  const hasRows = currentSectionEntries().length > 0;
  return `<button class="dz-btn btn-signoff" id="signOffBtn" ${hasRows ? '' : 'disabled'}><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15.7 4.3a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4L9.4 18.6l-4 1 1-4L15.7 4.3z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Sign-Off</button>`;
}

function bindApprovalRowEvents(){
  const sob = document.getElementById('signOffBtn'); if(sob) sob.onclick = askSignConfirm;
  const sy = document.getElementById('signYes'); if(sy) sy.onclick = confirmSignPassword;
  const sn = document.getElementById('signNo'); if(sn) sn.onclick = cancelSignConfirm;
  const pwf = document.getElementById('pwField');
  if(pwf){ pwf.oninput = e=>{ state.signUI.pwInput = e.target.value; }; pwf.onkeydown = e=>{ if(e.key==='Enter') confirmSignPassword(); }; }

  const apb = document.getElementById('approveBtn'); if(apb) apb.onclick = doSignApprove;
  const nsb = document.getElementById('notSignBtn'); if(nsb) nsb.onclick = askRejectConfirm;
  const cab = document.getElementById('cancelActionBtn'); if(cab) cab.onclick = cancelSignOffActions;

  const rjy = document.getElementById('rejectYes'); if(rjy) rjy.onclick = doRejectApprove;
  const rjcb = document.getElementById('rejectCancelBtn'); if(rjcb) rjcb.onclick = cancelRejectConfirm;
  const rjc = document.getElementById('rejectCommentField');
  if(rjc){ rjc.oninput = e=>{ state.signUI.rejectComment = e.target.value; }; }

  const ub = document.getElementById('unlockBtn'); if(ub) ub.onclick = askUnlockConfirm;
  const uy = document.getElementById('unlockYes'); if(uy) uy.onclick = doUnlockApprove;
  const un = document.getElementById('unlockNo'); if(un) un.onclick = cancelUnlockConfirm;
  const pwfu = document.getElementById('pwFieldUnlock');
  if(pwfu){ pwfu.oninput = e=>{ state.signUI.pwInput = e.target.value; }; pwfu.onkeydown = e=>{ if(e.key==='Enter') doUnlockApprove(); }; }
}

// Khóa toàn bộ form "Add new stamp" + nút xoá trong bảng khi tab hiện tại đã Signed off /
// Not signed (locked = approved || rejected). Mở lại bằng nút "Unlock" trong Sign Status panel.
function updateLockUI(){
  const section = state.activeSection;
  const isEntrySection = (section === 'WORKER' || section === 'QC');
  const s = isEntrySection ? state.sign[section] : null;
  const locked = !!(s && (s.approved || s.rejected));

  ['fFactory','fStampName','fReceiver','fQty','fStatus','btnAdd','btnTakePhoto','btnUploadFile'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.disabled = locked;
  });
  const dz = document.getElementById('dropzone');
  if(dz) dz.classList.toggle('locked', locked);

  document.querySelectorAll('#tbody .btn-del').forEach(btn=> btn.disabled = locked);

  const notice = document.getElementById('lockNotice');
  if(notice){
    if(locked){
      notice.style.display = 'block';
      notice.textContent = s.rejected
        ? 'This form has been marked not signed — no further changes allowed. Click "Unlock" below to make changes.'
        : 'This form has been signed off — no further changes allowed. Click "Unlock" below to make changes.';
    }else{
      notice.style.display = 'none';
    }
  }
}

function statusPillClass(s){
  if(/lost/i.test(s)) return 'pill-bad';
  if(/broken/i.test(s)) return 'pill-default';
  if(/usable/i.test(s)) return 'pill-info';
  return 'pill-ok';
}

        <button id="confirmYesBtn" style="background:#C0392B;color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;border:none;cursor:pointer;">Yes</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = ()=> overlay.remove();
  document.getElementById('confirmNoBtn').onclick = close;
  document.getElementById('confirmYesBtn').onclick = ()=>{ close(); onYes(); };
  overlay.addEventListener('click', e=>{ if(e.target === overlay) close(); });
}

// ---- Summary tab: toggle visibility + build the combo (stacked bar + total line) charts ----
let summaryCharts = {};

// Chart.js v4 doesn't support dashed grid lines out of the box (only the axis border can be
// dashed), so this small plugin manually draws a dashed vertical line at each factory boundary.
const dashedFactoryGridPlugin = {
  id: 'dashedFactoryGrid',
  beforeDraw(chart, args, opts){
    if(!opts || !opts.enabled) return;
    const { ctx, chartArea, scales } = chart;
    const xScale = scales.x;
    if(!xScale || !xScale.ticks || xScale.ticks.length < 2) return;
    const pixels = xScale.ticks.map((t,i)=> xScale.getPixelForTick(i));
    const step = pixels[1] - pixels[0];
    const half = step / 2;
    const boundaries = pixels.map(p=> p - half);
    boundaries.push(pixels[pixels.length - 1] + half);
    ctx.save();
    ctx.strokeStyle = opts.color || '#C7CCD3';
    ctx.lineWidth = opts.lineWidth || 1;
    ctx.setLineDash(opts.dash || [4,4]);
    boundaries.forEach(x=>{
      ctx.beginPath();
      ctx.moveTo(x, chartArea.top);
      ctx.lineTo(x, chartArea.bottom);
      ctx.stroke();
    });
    ctx.restore();
  }
};
// NOTE: not globally registered via Chart.register() here — it's passed as a per-instance
// plugin in each `new Chart(...)` call (buildCurrentYearChart / buildCompareChart) instead,
// so it always applies regardless of load-order/timing on any hosting environment.

// Shared data-label rule for the Summary charts: hide the label entirely when the value is 0/empty.
function hasNonZeroValue(ctx){
  const v = ctx.dataset.data[ctx.dataIndex];
  return v !== 0 && v !== null && v !== undefined;
}
const BAR_DATALABELS = { display: hasNonZeroValue, anchor: 'end', align: 'top', offset: 2, color: '#3A4552', font: { size: 9, weight: '600' } };
const LINE_DATALABELS = (color)=> ({
  display: hasNonZeroValue, anchor: 'end', align: 'top', offset: 4, color, font: { size: 9.5, weight: '700' },
  backgroundColor: 'rgba(255,255,255,.85)', borderRadius: 3, padding: { top: 1, bottom: 1, left: 3, right: 3 }
});

function toggleSummarySection(){
  const isSummary = state.activeSection === 'SUMMARY';
  document.getElementById('sectionGrid').style.display = isSummary ? 'none' : '';
  document.getElementById('sectionSummary').style.display = isSummary ? 'block' : 'none';
  if(isSummary){
    // Chart.js/datalabels are only fetched the first time the Summary tab is opened.
    ensureChartLib().then(()=>{
      // wait one frame so the now-visible canvas has a real width before Chart.js measures it
      requestAnimationFrame(renderSummaryCharts);
    }).catch(err=>{
      console.error('Failed to load chart library:', err);
      alert('Could not load the charting library. Please check your internet connection and try again.');
    });
  }
}

// Default year pair used to seed the compare dropdowns: current calendar year vs. the one right before it.
function summaryYearPair(){
  const curYear = new Date().getFullYear();
  return { prevYear: curYear - 1, curYear };
}

// Years to offer in a section's compare dropdowns: the standard 2025..current range, plus any
// year that actually has data for that section (in case of older/odd records).
function yearsInUseForSection(section){
  const set = new Set(yearOptionsList());
  state.entries.filter(e=>entrySection(e)===section).forEach(e=>{ if(e.year) set.add(Number(e.year)); });
  return Array.from(set).sort((a,b)=>b-a);
}

// ---- Left chart: current-year breakdown per factory (4 grouped bars + total line) ----
function currentYearData(section){
  const { curYear } = summaryYearPair();
  const byFactory = FACTORY_LIST.map(f=>{
    const rec = { Using:0, Broken:0, Lost:0, 'Usable/Not Use':0 };
    state.entries
      .filter(e=> entrySection(e)===section && e.factory===f && Number(e.year)===curYear)
      .forEach(e=>{
        const qty = Number(e.qty) || 0;
        if(rec[e.status] !== undefined){ rec[e.status] += qty; }
      });
    return rec;
  });
  const totals = byFactory.map(rec=> STAMP_STATUSES.reduce((sum,k)=> sum + rec[k], 0));
  return { labels: FACTORY_LIST, byFactory, totals, curYear };
}

// Rounds an axis max up to a clean step so ticks land on tidy numbers instead of odd fractions.
function niceAxisMax(rawMax){
  if(rawMax <= 0) return 1;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawMax)));
  const step = magnitude / 2 || 1;
  return Math.ceil(rawMax / step) * step;
}

function buildCurrentYearChart(canvasId, section){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const { labels, byFactory, totals, curYear } = currentYearData(section);

  // No 'stack' set => the 4 status datasets render as 4 adjacent grouped bars per factory.
  const datasets = STAMP_STATUSES.map(status=>({
    type: 'bar',
    label: status,
    data: byFactory.map(rec=> rec[status]),
    backgroundColor: STATUS_COLORS[status],
    borderRadius: 3,
    maxBarThickness: 20,
    yAxisID: 'y',
    order: 2, // drawn first, so it sits underneath the line
    datalabels: BAR_DATALABELS
  }));
  datasets.push({
    type: 'line',
    label: 'Total ' + curYear,
    data: totals,
    borderColor: '#1B3A63',
    backgroundColor: '#1B3A63',
    borderWidth: 2.5,
    pointRadius: 4,
    pointHoverRadius: 5,
    pointBackgroundColor: '#1B3A63',
    tension: 0.25,
    yAxisID: 'y1',
    order: 1, // drawn last, always renders on top of the bars
    datalabels: LINE_DATALABELS('#1B3A63')
  });

  // Scale each axis off its own data range, giving the bar axis extra headroom so bars stay
  // in the lower part of the chart and the total line always reads above them.
  const maxBarVal = Math.max(1, ...byFactory.flatMap(rec=> STAMP_STATUSES.map(s=> rec[s])));
  const maxLineVal = Math.max(1, ...totals);
  const barAxisMax = niceAxisMax(maxBarVal * 2.2);
  const lineAxisMax = niceAxisMax(maxLineVal * 1.15);

  if(summaryCharts[canvasId]){ summaryCharts[canvasId].destroy(); }
  summaryCharts[canvasId] = new Chart(canvas.getContext('2d'), {
    // Passed directly to this chart instance (rather than relying on a global Chart.register())
    // so the dashed factory-separator lines don't depend on plugin-registration timing at all —
    // this is what kept failing on deployed URLs while working when opening the file locally.
    plugins: [dashedFactoryGridPlugin],
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 10.5 }, boxWidth: 11, padding: 10 } },
        tooltip: { mode: 'index', intersect: false },
        dashedFactoryGrid: { enabled: true, color: '#C7CCD3', dash: [4,4] }
      },
      scales: {
        x: { grid: { display: false, drawTicks: false }, ticks: { font: { size: 11 } } },
        y: {
          type: 'linear', position: 'left',
          min: 0, max: barAxisMax, ticks: { precision: 0, maxTicksLimit: 5 },
          grid: { color: '#EEF1F4' }
        },
        y1: {
          type: 'linear', position: 'right',
          min: 0, max: lineAxisMax, ticks: { precision: 0, maxTicksLimit: 5 },
          grid: { drawOnChartArea: false }
        }
      }
    }
  });
}

// ---- Right chart: compare two chosen years (Using-only bars + Total lines), per factory ----
function compareYearsData(section, yearA, yearB){
  const dataFor = (y)=> FACTORY_LIST.map(f=>{
    const rows = state.entries.filter(e=> entrySection(e)===section && e.factory===f && Number(e.year)===y);
    const using = rows.filter(e=>e.status==='Using').reduce((s,e)=> s + (Number(e.qty)||0), 0);
    // Total line only counts Using + Usable/Not Use — Broken and Lost are excluded.
    const total = rows
      .filter(e=> e.status==='Using' || e.status==='Usable/Not Use')
      .reduce((s,e)=> s + (Number(e.qty)||0), 0);
    return { using, total };
  });
  const a = dataFor(yearA);
  const b = dataFor(yearB);
  return {
    labels: FACTORY_LIST,
    usingA: a.map(x=>x.using), usingB: b.map(x=>x.using),
    totalA: a.map(x=>x.total), totalB: b.map(x=>x.total)
  };
}

function buildCompareChart(canvasId, section, yearA, yearB){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const { labels, usingA, usingB, totalA, totalB } = compareYearsData(section, yearA, yearB);

  const datasets = [
    {
      type: 'bar', label: 'Using ' + yearA, data: usingA,
      backgroundColor: 'rgba(30,142,90,0.5)', borderRadius: 3, maxBarThickness: 26, yAxisID: 'y', order: 2,
      datalabels: BAR_DATALABELS
    },
    {
      type: 'bar', label: 'Using ' + yearB, data: usingB,
      backgroundColor: STATUS_COLORS['Using'], borderRadius: 3, maxBarThickness: 26, yAxisID: 'y', order: 2,
      datalabels: BAR_DATALABELS
    },
    {
      type: 'line', label: 'Total ' + yearA, data: totalA,
      borderColor: '#8FA6C2', backgroundColor: '#8FA6C2', borderWidth: 2, borderDash: [5,3],
      pointRadius: 4, pointHoverRadius: 5, pointBackgroundColor: '#8FA6C2', tension: 0.25, yAxisID: 'y1', order: 1,
      datalabels: LINE_DATALABELS('#5E7998')
    },
    {
      type: 'line', label: 'Total ' + yearB, data: totalB,
      borderColor: '#1B3A63', backgroundColor: '#1B3A63', borderWidth: 2.5,
      pointRadius: 4, pointHoverRadius: 5, pointBackgroundColor: '#1B3A63', tension: 0.25, yAxisID: 'y1', order: 1,
      datalabels: LINE_DATALABELS('#1B3A63')
    }
  ];

  // Same headroom trick as the left chart: bar axis gets extra ceiling so the total lines
  // (on their own axis) always trace above the bar tops.
  const maxBarVal = Math.max(1, ...usingA, ...usingB);
  const maxLineVal = Math.max(1, ...totalA, ...totalB);
  const barAxisMax = niceAxisMax(maxBarVal * 2.2);
  const lineAxisMax = niceAxisMax(maxLineVal * 1.15);

  if(summaryCharts[canvasId]){ summaryCharts[canvasId].destroy(); }
  summaryCharts[canvasId] = new Chart(canvas.getContext('2d'), {
    // See buildCurrentYearChart() for why this is passed per-instance instead of via
    // a global Chart.register() call.
    plugins: [dashedFactoryGridPlugin],
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 10.5 }, boxWidth: 11, padding: 10 } },
        tooltip: { mode: 'index', intersect: false },
        dashedFactoryGrid: { enabled: true, color: '#C7CCD3', dash: [4,4] }
      },
      scales: {
        x: { grid: { display: false, drawTicks: false }, ticks: { font: { size: 11 } } },
        y: {
          type: 'linear', position: 'left',
          min: 0, max: barAxisMax, ticks: { precision: 0, maxTicksLimit: 5 },
          grid: { color: '#EEF1F4' }
        },
        y1: {
          type: 'linear', position: 'right',
          min: 0, max: lineAxisMax, ticks: { precision: 0, maxTicksLimit: 5 },
          grid: { drawOnChartArea: false }
        }
      }
    }
  });
}

const SUMMARY_CANVAS_IDS = ['workerCurrentYearChart','workerCompareChart','qcCurrentYearChart','qcCompareChart'];

function showSummaryLibError(show){
  SUMMARY_CANVAS_IDS.forEach(id=>{
    const canvas = document.getElementById(id);
    if(!canvas) return;
    const wrap = canvas.parentElement;
    let msg = wrap.querySelector('.summary-chart-error');
    if(show){
      canvas.style.display = 'none';
      if(!msg){
        msg = document.createElement('div');
        msg.className = 'summary-chart-error';
        msg.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;color:var(--warn);font-size:12.5px;text-align:center;padding:0 20px;';
        msg.textContent = 'Không tải được thư viện biểu đồ (Chart.js). Vui lòng kiểm tra kết nối mạng rồi bấm Refresh.';
        wrap.appendChild(msg);
      }
    }else{
      canvas.style.display = '';
      if(msg) msg.remove();
    }
  });
}

function renderSummaryCharts(){
  if(typeof Chart === 'undefined'){
    // Chart.js didn't load (e.g. blocked network / CDN unreachable) — show a clear message instead of a blank canvas.
    showSummaryLibError(true);
    return;
  }
  showSummaryLibError(false);
  try{
    const { prevYear, curYear } = summaryYearPair();
    document.getElementById('workerCurrentYearTitle').textContent = 'Worker Packing Chop Summary (' + curYear + ')';
    document.getElementById('qcCurrentYearTitle').textContent = 'QC Packing Chop Summary (' + curYear + ')';

    buildCurrentYearChart('workerCurrentYearChart', 'WORKER');
    buildCurrentYearChart('qcCurrentYearChart', 'QC');

    const workerYears = yearsInUseForSection('WORKER');
    populateCompareYearSelect('workerCompareYearA', workerYears, prevYear);
    populateCompareYearSelect('workerCompareYearB', workerYears, curYear);
    const w = getCompareYears('worker');
    buildCompareChart('workerCompareChart', 'WORKER', w.yearA, w.yearB);

    const qcYears = yearsInUseForSection('QC');
    populateCompareYearSelect('qcCompareYearA', qcYears, prevYear);
    populateCompareYearSelect('qcCompareYearB', qcYears, curYear);
    const q = getCompareYears('qc');
    buildCompareChart('qcCompareChart', 'QC', q.yearA, q.yearB);
  }catch(err){
    console.error('Summary chart render failed:', err);
  }
}

// ---- Receiver/ID search-select (backed by the employee directory) ----
const receiverInput = document.getElementById('fReceiver');
const receiverDropdown = document.getElementById('receiverDropdown');
let receiverActiveIndex = -1;
let receiverMatches = [];

function normalizeSearch(s){
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // strip Vietnamese diacritics
}

function searchEmployees(query){
  const q = normalizeSearch(query).trim();
  const factoryCode = document.getElementById('fFactory').value;
  const pool = EMPLOYEES.filter(emp => factoryLabelToCode(emp.factory) === factoryCode);
  if(!q) return [];
  return pool.filter(emp=>
    normalizeSearch(emp.name).includes(q) ||
    normalizeSearch(emp.id).includes(q)
  ).slice(0, 30);
}

function renderReceiverDropdown(matches){
  receiverMatches = matches;
  receiverActiveIndex = -1;
  if(matches.length === 0){
    receiverDropdown.innerHTML = '<div class="receiver-empty">No matching employee found</div>';
  }else{
    receiverDropdown.innerHTML = matches.map((emp, i)=>`
      <div class="receiver-option" data-idx="${i}">
        <div class="rname">${escapeHtml(emp.name)}</div>
        <div class="rmeta">${escapeHtml(emp.id)} • ${escapeHtml(emp.factory)}</div>
      </div>
    `).join('');
    receiverDropdown.querySelectorAll('.receiver-option').forEach(opt=>{
      opt.addEventListener('mousedown', e=>{
        e.preventDefault(); // keep focus so 'blur' hide doesn't fire before click
        selectReceiver(matches[Number(opt.dataset.idx)]);
      });
    });
  }
  receiverDropdown.classList.add('show');
}

function selectReceiver(emp){
  receiverInput.value = `${emp.name} / ${emp.id}`;
  const factoryCode = factoryLabelToCode(emp.factory);
  if(factoryCode){
    const sel = document.getElementById('fFactory');
    const found = Array.from(sel.options).some(o=>o.value===factoryCode);
    if(found) sel.value = factoryCode;
    updateFactoryPlaceholderColor();
  }
  hideReceiverDropdown();
}

function hideReceiverDropdown(){
  receiverDropdown.classList.remove('show');
  receiverDropdown.innerHTML = '';
  receiverMatches = [];
  receiverActiveIndex = -1;
}

receiverInput.addEventListener('input', ()=>{
  if(receiverInput.disabled) return;
  const matches = searchEmployees(receiverInput.value);
  if(matches.length === 0 && !receiverInput.value.trim()){
    hideReceiverDropdown();
    return;
  }
  renderReceiverDropdown(matches);
});

receiverInput.addEventListener('focus', ()=>{
  if(receiverInput.disabled) return;
  if(receiverInput.value.trim()) renderReceiverDropdown(searchEmployees(receiverInput.value));
});

receiverInput.addEventListener('blur', ()=> hideReceiverDropdown());

// Changing Factory invalidates any previously picked receiver (they belong to the old factory),
// so clear the field and let the user re-search within the newly selected factory.
document.getElementById('fFactory').addEventListener('change', ()=>{
  receiverInput.value = '';
  hideReceiverDropdown();
  updateFactoryPlaceholderColor();
});

receiverInput.addEventListener('keydown', e=>{
  if(!receiverDropdown.classList.contains('show') || receiverMatches.length === 0) return;
  const opts = receiverDropdown.querySelectorAll('.receiver-option');
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    receiverActiveIndex = Math.min(receiverActiveIndex + 1, opts.length - 1);
  }else if(e.key === 'ArrowUp'){
    e.preventDefault();
    receiverActiveIndex = Math.max(receiverActiveIndex - 1, 0);
  }else if(e.key === 'Enter'){
    if(receiverActiveIndex >= 0){
      e.preventDefault();
      selectReceiver(receiverMatches[receiverActiveIndex]);
    }
    return;
  }else if(e.key === 'Escape'){
    hideReceiverDropdown();
    return;
  }else{
    return;
  }
  opts.forEach((o,i)=> o.classList.toggle('active', i === receiverActiveIndex));
});
