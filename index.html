  if(e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e=>{
  if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
});
fileInputCamera.addEventListener('change', e=>{
  if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
});

function resetDropzone(){
  document.getElementById('dzHintText').textContent = '';
  document.getElementById('dzPreview').innerHTML = '';
  ocrStatus.className = 'ocr-status';
  fileInput.value = '';
  fileInputCamera.value = '';
}

function setOcrStatus(msg, type){
  ocrStatus.textContent = msg;
  ocrStatus.className = 'ocr-status show ' + type;
}

async function handleFile(file){
  if(!file.type.startsWith('image/')){
    alert('Please choose an image file.');
    return;
  }
  setOcrStatus('Preparing image...', 'loading');
  try{
    const { dataUrl, canvas, ocrCanvas } = await normalizeImage(file);
    document.getElementById('dzPreview').innerHTML = `<img src="${dataUrl}" alt="preview">`;
    document.getElementById('dzHintText').textContent = '✓ Image attached';

    // Thumbnail (fast local canvas resize) and OCR (slow) don't depend on
    // each other — run them concurrently instead of waiting for the
    // thumbnail before starting OCR. OCR reads from the higher-resolution
    // ocrCanvas, not the smaller preview canvas.
    const thumbPromise = makeThumbnail(canvas);
    const ocrPromise = ocrExtract(ocrCanvas, state.activeSection).catch(err => ({ __ocrError: err }));
    const [thumb, result] = await Promise.all([thumbPromise, ocrPromise]);
    pendingImage = thumb;
    if(result && result.__ocrError) throw result.__ocrError;

    if(result.factory){
      const sel = document.getElementById('fFactory');
      let found = Array.from(sel.options).some(o=>o.value===result.factory);
      if(!found){
        const o = document.createElement('option');
        o.value = result.factory; o.textContent = result.factory;
        sel.appendChild(o);
      }
      sel.value = result.factory;
      updateFactoryPlaceholderColor();
    }
    if(result.stamp_name){
      document.getElementById('fStampName').value = result.stamp_name;
    }
    const isValid = state.activeSection === 'QC' ? isValidQCResult : isValidWorkerResult;
    if(!result.factory && !result.stamp_name){
      setOcrStatus('Image attached. Text could not be auto-recognized — please fill in the fields manually.', 'err');
    }else if(!isValid(result)){
      setOcrStatus(`⚠ Uncertain reading: Factory ${result.factory || '?'} / Stamp name ${result.stamp_name || '?'} — image may be blurry or small; please verify and correct manually.`, 'err');
    }else{
      setOcrStatus(`✓ Detected: Factory ${result.factory || '?'} / Stamp name ${result.stamp_name || '?'} — please double-check before adding.`, 'ok');
    }
  }catch(err){
    console.error('OCR error:', err);
    setOcrStatus('Could not auto-read the image (' + (err && err.message ? err.message : 'unknown error') + ') — please enter the details manually below.', 'err');
  }
}

// Load the file as an image source, correctly applying EXIF rotation.
// Mobile camera photos carry an EXIF orientation flag; <img> display
// auto-rotates for viewing, but a plain new Image() + canvas.drawImage()
// does NOT reliably re-apply that rotation on many mobile browsers — the
// thumbnail looks upright while OCR silently reads a sideways image.
// createImageBitmap with imageOrientation:'from-image' fixes this consistently.
async function loadOrientedImageSource(file){
  if(typeof createImageBitmap === 'function'){
    try{
      return await createImageBitmap(file, { imageOrientation: 'from-image' });
    }catch(err){
      // fall through to the <img> fallback below
    }
  }
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Could not read the selected file'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Unsupported or corrupted image format'));
      img.onload = ()=> resolve(img);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Resize the uploaded image onto canvases for preview + OCR input.
//
// Phone camera photos behave very differently from a desktop file upload:
// they're typically much higher native resolution, but the stamp itself
// only occupies a small part of the frame (packaging, hand, background
// around it) and often has uneven lighting/shadow from holding the phone
// close. A pre-cropped desktop screenshot/photo doesn't have either
// problem. So OCR gets its own higher-resolution working copy, separate
// from the smaller canvas used for on-screen preview + thumbnail.
async function normalizeImage(file){
  const source = await loadOrientedImageSource(file);

  function drawScaled(minDim, maxDim){
    let width = source.width, height = source.height;
    const maxSide = Math.max(width, height);
    let scale = 1;
    if(maxSide < minDim) scale = minDim / maxSide;
    else if(maxSide > maxDim) scale = maxDim / maxSide;
    width = Math.round(width * scale);
    height = Math.round(height * scale);

    const c = document.createElement('canvas');
    c.width = width;
    c.height = height;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high'; // sharper downscale — keeps label text crisper than the browser default
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(source, 0, 0, width, height);
    return c;
  }

  // Preview/thumbnail copy — kept modest for fast on-screen rendering and storage.
  const canvas = drawScaled(900, 1400);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

  // OCR working copy — higher cap so a full-resolution phone photo still
  // leaves the label with enough real detail, even before any further
  // crop/upscale done in the OCR retry passes.
  const ocrCanvas = drawScaled(1000, 2200);

  if(source.close) source.close(); // release ImageBitmap memory
  return { dataUrl, canvas, ocrCanvas };
}

// Small copy of the image kept in app storage + used in the Stamp name
// column (table) and embedded into the exported Excel file.
function makeThumbnail(sourceCanvas){
  return new Promise((resolve)=>{
    const MAX_W = 260;
    const scale = Math.min(1, MAX_W / sourceCanvas.width);
    const w = Math.round(sourceCanvas.width * scale);
    const h = Math.round(sourceCanvas.height * scale);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(sourceCanvas, 0, 0, w, h);
    resolve({ dataUrl: c.toDataURL('image/jpeg', 0.82), w, h });
  });
}

// In-browser OCR via Tesseract.js — no server/API call, so it works
// offline and regardless of how this file is opened.
//
// SPEED: the slow part is not the recognize() call itself — it's the
// one-time cost of downloading tesseract.min.js + the English model and
// spinning up the WASM worker (often several seconds). getOcrWorker()
// caches that as a single promise, and warmUpOcrEngine() (called at the
// bottom of this block) kicks it off in the background as soon as the
// page is idle, so by the time a user actually attaches a photo the
// engine is already hot and recognize() runs immediately.
let ocrWorkerPromise = null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise = Tesseract.createWorker('eng').then(async (worker)=>{
      // Set parameters once, right after creation — not on every
      // recognize() call — to avoid a redundant worker round-trip
      // each time an image is read.
      await worker.setParameters({
        tessedit_ocr_engine_mode: '1', // LSTM only — skip the slower legacy engine
        tessedit_pageseg_mode: '6', // treat the label as one uniform block of text (2 short lines)
        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 -.:'
      });
      return worker;
    });
  }
  return ocrWorkerPromise;
}

// Pre-load the OCR script + worker + language data in the background so
// the cost is paid before the user needs it, not after they load an image.
function warmUpOcrEngine(){
  const start = ()=>{
    ensureTesseract().then(()=> getOcrWorker()).catch(()=>{
      // Silent — a real failure here just means the first actual OCR
      // attempt will retry the load and surface the error normally.
    });
  };
  if('requestIdleCallback' in window){
    requestIdleCallback(start, { timeout: 4000 });
  }else{
    setTimeout(start, 1500);
  }
}
warmUpOcrEngine();

// Convert to grayscale, optionally applying Otsu auto-threshold (pure black/white).
// Phone photos of the fabric stamp label carry weave texture (moiré) and
// uneven lighting that confuses OCR inconsistently between the two lines —
// binarizing removes that texture noise and gives Tesseract a clean,
// high-contrast image regardless of shooting conditions. But on glossy/
// reflective backgrounds (foil packaging, plastic bags) a single global
// threshold can also clip part of the ink — binarize:false keeps a plain
// grayscale version available as a fallback for that case.
function preprocessForOcr(sourceCanvas, { binarize = true } = {}){
  const c = document.createElement('canvas');
  c.width = sourceCanvas.width;
  c.height = sourceCanvas.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(sourceCanvas, 0, 0);
  const imgData = ctx.getImageData(0, 0, c.width, c.height);
  const d = imgData.data;

  const n = d.length / 4;
  const gray = new Uint8ClampedArray(n);
  const hist = new Array(256).fill(0);
  for(let i = 0, j = 0; i < d.length; i += 4, j++){
    const v = (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]) | 0;
    gray[j] = v;
    hist[v]++;
  }

  if(!binarize){
    // Contrast-stretch (1st–99th percentile) — phone photos taken with the
    // phone close to the label often cast a shadow that compresses the
    // ink/background contrast; this rescales it back to full range before
    // OCR sees it. Desktop-uploaded, already-well-lit photos pass through
    // this almost unchanged since their percentiles are already near 0/255.
    const total = n;
    let cum = 0, lowP = 0, highP = 255;
    const lowTarget = total * 0.01;
    const highBudget = total * 0.01; // pixels allowed above the high cutoff
    for(let t = 0; t < 256; t++){ cum += hist[t]; if(cum >= lowTarget){ lowP = t; break; } }
    cum = 0;
    for(let t = 255; t >= 0; t--){ cum += hist[t]; if(cum >= highBudget){ highP = t; break; } }
    const range = Math.max(1, highP - lowP);
    for(let i = 0, j = 0; i < d.length; i += 4, j++){
      let v = Math.round((gray[j] - lowP) * 255 / range);
      if(v < 0) v = 0; else if(v > 255) v = 255;
      d[i] = d[i+1] = d[i+2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
    return c;
  }

  // Otsu's method: pick the threshold that best separates ink from background.
  let sum = 0;
  for(let t = 0; t < 256; t++) sum += t * hist[t];
  let sumB = 0, wB = 0, varMax = 0, threshold = 127;
  for(let t = 0; t < 256; t++){
    wB += hist[t];
    if(wB === 0) continue;
    const wF = n - wB;
    if(wF === 0) break;
    sumB += t * hist[t];
    const mB = sumB / wB;
    const mF = (sum - sumB) / wF;
    const varBetween = wB * wF * (mB - mF) * (mB - mF);
    if(varBetween > varMax){ varMax = varBetween; threshold = t; }
  }

  for(let i = 0, j = 0; i < d.length; i += 4, j++){
    const v = gray[j] > threshold ? 255 : 0;
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
  return c;
}

// Crop to the center portion of the image and upscale it back up.
// Phone camera shots usually have the stamp roughly centered but only
// taking up a fraction of the frame (background/packaging/hand around
// it) — this crops out that surrounding clutter and gives the label text
// significantly more real pixels than the full frame did, which a plain
// resize can't recover once detail has already been downscaled away.
function centerCropUpscale(sourceCanvas, cropFraction, minTargetDim){
  const cw = Math.max(1, Math.round(sourceCanvas.width * cropFraction));
  const ch = Math.max(1, Math.round(sourceCanvas.height * cropFraction));
  const sx = Math.round((sourceCanvas.width - cw) / 2);
  const sy = Math.round((sourceCanvas.height - ch) / 2);

  const shortSide = Math.min(cw, ch);
  const scale = Math.max(1, minTargetDim / shortSide); // never downscale further
  const outW = Math.round(cw * scale);
  const outH = Math.round(ch * scale);

  const c = document.createElement('canvas');
  c.width = outW;
  c.height = outH;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(sourceCanvas, sx, sy, cw, ch, 0, 0, outW, outH);
  return c;
}

// A parsed result only gets auto-filled into the form if it plausibly
// matches the known label formats — this stops obviously-wrong OCR noise
// (e.g. a single stray letter, or a factory number that doesn't exist)
// from silently overwriting the fields with garbage.
function isValidFactory(factory){
  return !!factory && FACTORY_LIST.includes(factory);
}
function isValidQCResult(result){
  if(!result || !isValidFactory(result.factory)) return false;
  // Expect a 2-4 letter code, optionally with a trailing "-<number>" (e.g. "PA-2").
  return !!result.stamp_name && /^[A-Za-z]{2,4}(-\d{1,3})?$/.test(result.stamp_name);
}
function isValidWorkerResult(result){
  if(!result || !isValidFactory(result.factory)) return false;
  // Expect a 1-4 letter code followed by a running number (e.g. "PA-7").
  return !!result.stamp_name && /^[A-Za-z]{1,4}-?\d{1,4}$/.test(result.stamp_name);
}
// Rough score for picking the "least bad" result when no attempt fully
// validates — favors attempts that found more of the expected fields.
function scoreOcrResult(result, isValid){
  if(!result) return -1;
  if(isValid(result)) return 3;
  let s = 0;
  if(isValidFactory(result.factory)) s++;
  if(result.stamp_name) s++;
  return s;
}

async function ocrRecognizeText(worker, canvas, psm){
  if(psm){
    await worker.setParameters({ tessedit_pageseg_mode: psm });
  }
  const { data } = await worker.recognize(canvas);
  return (data && data.text) ? data.text : '';
}

async function ocrExtract(canvas, section){
  if(typeof Tesseract === 'undefined'){
    setOcrStatus('Loading OCR engine...', 'loading');
    try{
      await ensureTesseract();
    }catch(e){
      throw new Error('OCR engine failed to load — check your internet connection');
    }
  }
  setOcrStatus('Reading image...', 'loading');
  const worker = await getOcrWorker();
  const parse = section === 'QC' ? parseQCStampLabelText : parseStampLabelText;
  const isValid = section === 'QC' ? isValidQCResult : isValidWorkerResult;

  let best = null;
  function tryUpdate(result){
    if(isValid(result)) return result;
    if(scoreOcrResult(result, isValid) > scoreOcrResult(best, isValid)) best = result;
    return null;
  }

  const otsuCanvas = preprocessForOcr(canvas, { binarize: true });

  // Pass 1 (fast path — matches the worker's default parameters, so a
  // clear, well-framed photo resolves in a single recognize() call):
  // full frame, binarized, "single uniform block of text" segmentation.
  let text = await ocrRecognizeText(worker, otsuCanvas, '6');
  let hit = tryUpdate(parse(text));
  if(hit) return hit;

  // Pass 2: center-crop + upscale, binarized — this is the fix for phone
  // camera photos specifically, where the stamp is small inside a much
  // larger frame (packaging/hand/background) unlike a pre-cropped desktop
  // upload; cropping out the clutter and upscaling gives the label text
  // real extra pixels to be read from.
  const cropOtsu = preprocessForOcr(centerCropUpscale(canvas, 0.55, 1100), { binarize: true });
  text = await ocrRecognizeText(worker, cropOtsu, '6');
  hit = tryUpdate(parse(text));
  if(hit) return hit;

  // Pass 3: full frame, plain grayscale with contrast-stretch (no
  // binarization) — recovers labels lost when uneven phone-camera
  // lighting/shadow or a glossy/reflective background (foil pouch,
  // plastic film) breaks Pass 1's single global threshold.
  const grayCanvas = preprocessForOcr(canvas, { binarize: false });
  text = await ocrRecognizeText(worker, grayCanvas, '6');
  hit = tryUpdate(parse(text));
  if(hit) return hit;

  // Pass 4: center-crop + upscale, grayscale — combines both fixes for a
  // small, poorly-lit stamp in a phone photo.
  const cropGray = preprocessForOcr(centerCropUpscale(canvas, 0.55, 1100), { binarize: false });
  text = await ocrRecognizeText(worker, cropGray, '6');
  hit = tryUpdate(parse(text));
  if(hit) return hit;

  // Pass 5: sparse-text segmentation on the full-frame binarized image —
  // helps when background clutter around the stamp breaks Pass 1's "one
  // text block" assumption and the real label gets missed entirely.
  text = await ocrRecognizeText(worker, otsuCanvas, '11');
  hit = tryUpdate(parse(text));
  // Restore the default fast mode for the next image.
  await worker.setParameters({ tessedit_pageseg_mode: '6' });
  if(hit) return hit;

  // Nothing fully validated — return the best-effort guess so the user
  // still gets a starting point, but the caller's "please double-check"
  // messaging covers the case where fields may be wrong or missing.
  return best || { factory: '', stamp_name: '' };
}

// Heuristic parser for the two-line stamp label format, e.g.:
//   F1
//   PA - 1
function parseStampLabelText(rawText){
  const lines = rawText
    .split(/\r?\n/)
    .map(l => l.trim())
    .filter(l => l.length > 0);

  const factoryRegex = /\bF\s?-?\s?(\d{1,2})\b/i;
  let factory = '';

  for(const line of lines){
    const m = line.match(factoryRegex);
    if(m){ factory = 'F' + m[1]; break; }
  }
  if(!factory){
    const m = rawText.match(factoryRegex);
    if(m) factory = 'F' + m[1];
  }

  const candidates = lines.filter(line=>{
    const compact = line.replace(/\s+/g,'').toUpperCase();
    return compact !== factory && compact.length > 0;
  });
  let stamp_name = '';
  if(candidates.length){
    stamp_name = candidates.sort((a,b)=>b.length - a.length)[0];
    // Normalize stray OCR spacing around the hyphen, e.g. "PA - 7" -> "PA-7".
    stamp_name = stamp_name.replace(/\s*-\s*/g, '-').replace(/\s+/g, '');
  }

  return { factory, stamp_name };
}

// Heuristic parser for the QC Packing Chop label format, which flips the
// line order and packs the running number directly onto the Factory line
// (no separating space), e.g.:
//   PA
//   F3-2
// -> Factory = "F3" (from line 2), Stamp name = "PA-2" (letters-only code
//    line + trailing number on the factory line, joined with no spaces).
function parseQCStampLabelText(rawText){
  const lines = rawText
    .split(/\r?\n/)
    .map(l => l.trim())
    .filter(l => l.length > 0);

  const factoryRegex = /\bF\s?-?\s?(\d{1,2})\b/i;

  // Factory + running number are expected on line 2; fall back to
  // whichever line actually contains the factory code if OCR misreads
  // line breaks or inserts a stray noise line.
  let factoryLineIdx = -1;
  let fMatch = null;
  const preferredLine = lines[1];
  if(preferredLine){
    const m = preferredLine.match(factoryRegex);
    if(m){ factoryLineIdx = 1; fMatch = m; }
  }
  if(!fMatch){
    for(let i=0;i<lines.length;i++){
      const m = lines[i].match(factoryRegex);
      if(m){ factoryLineIdx = i; fMatch = m; break; }
    }
  }
  const factoryLine = factoryLineIdx >= 0 ? lines[factoryLineIdx] : '';

  const factory = fMatch ? ('F' + fMatch[1]) : '';

  // Trailing number = the last number on the factory line, found after
  // the factory code itself (e.g. "F3-2" -> 2, not the "3" in F3).
  let trailingNumber = '';
  if(fMatch){
    const afterFactory = factoryLine.slice(fMatch.index + fMatch[0].length);
    const nums = afterFactory.match(/\d+/g);
    if(nums && nums.length) trailingNumber = nums[nums.length - 1];
  }
  if(!trailingNumber && factoryLine){
    const allNums = factoryLine.match(/\d+/g);
    if(allNums && allNums.length > 1) trailingNumber = allNums[allNums.length - 1];
  }

  // The stamp code (e.g. "PA") is a short letters-only line — this skips
  // stray OCR noise (odd punctuation from the circular stamp border) that
  // isn't the factory line, and only falls back to "any other line" if no
  // clean letters-only candidate is found.
  const letterLineRegex = /^[A-Za-z]{1,6}$/;
  let codeLine = lines.find((l, i) => i !== factoryLineIdx && letterLineRegex.test(l));
  if(!codeLine){
    codeLine = lines.find((l, i) => i !== factoryLineIdx && l.length > 0) || '';
  }

  let stamp_name = '';
  if(codeLine && trailingNumber){
    stamp_name = `${codeLine}-${trailingNumber}`;
  }else if(codeLine){
    stamp_name = codeLine;
  }else if(trailingNumber){
    stamp_name = trailingNumber;
  }

  return { factory, stamp_name };
}

// ---- Export to Excel — one sheet per factory, respecting the active Factory/Year filter ----
document.getElementById('btnExport').onclick = async ()=>{
  const filteredRows = visibleSectionRows();
  const factories = factoriesInUse().filter(f => filteredRows.some(e=>e.factory===f));
  // F7 is always exported as a blank form when no F7 records exist.
  // Therefore an empty current filter is still exportable.
  if(factories.length===0){
    console.info('No data in current filter; exporting the F7 blank form.');
  }
  const btn = document.getElementById('btnExport');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Exporting...';

  try{
    if(typeof ExcelJS === 'undefined'){
      btn.textContent = 'Loading...';
      await ensureExcelJS();
    }

    // Safety net: some rows may still be missing their base64 image data
    // (e.g. entries whose thumbnail hasn't finished loading yet). Re-fetch
    // those before building the workbook so the exported Stamp name column
    // always shows the picture, not just the text.
    const missingImgIds = Array.from(new Set(
      filteredRows
        .filter(e => !e.imageDataUrl && e.imageFileId)
        .map(e => e.imageFileId)
    ));
    if(missingImgIds.length){
      btn.textContent = 'Loading images...';
      try{
        const r = await fetch(`${API_URL}?action=imageBase64Bulk&fileIds=${encodeURIComponent(missingImgIds.join(','))}`);
        const j = await r.json();
        const images = (j && j.images) || {};
        state.entries.forEach(en=>{
          if(!en.imageDataUrl && en.imageFileId && images[en.imageFileId]){
            en.imageDataUrl = images[en.imageFileId];
          }
        });
      }catch(imgErr){
        console.error('Không tải lại được ảnh trước khi export:', imgErr);
      }
    }

    btn.textContent = 'Exporting...';
    await exportToExcel(factories);
  }catch(err){
    console.error('Export error:', err);
    alert('Export failed: ' + (err && err.message ? err.message : 'unknown error'));
  }finally{
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
};

async function exportToExcel(factories){
  const wb = new ExcelJS.Workbook();

  // Always include F7 in the exported workbook, even when there is no F7 data.
  // Other factory sheets are still created according to the current filter.
  const exportFactories = Array.from(new Set([...(factories || []), 'F7']));
  const exportDate = todayISO();
  const logoImageId = wb.addImage({ base64: LOGO_BASE64, extension: 'png' });

  const NAVY = 'FF1B3A63';
  const FONT_NAME = 'Times New Roman';
  const FONT_SIZE = 11;
  const CENTER = { horizontal: 'center', vertical: 'middle' };
  const CENTER_LEFT = { horizontal: 'left', vertical: 'middle' };
  const baseFont = { name: FONT_NAME, size: FONT_SIZE };
  const HEADER_FONT = { name: FONT_NAME, size: FONT_SIZE, bold: true, color: { argb: 'FFFFFFFF' } };
  const TITLE_FONT = { name: FONT_NAME, size: FONT_SIZE, bold: true };
  const LABEL_FONT = { name: FONT_NAME, size: FONT_SIZE, bold: true };
  const THIN = { style: 'thin', color: { argb: 'FF9AA5B1' } };

  // Stamp image: fixed 2.6cm (W) x 2.2cm (H). Row height follows the image.
  const CM_TO_PX = 37.7952756;
  const CM_TO_PT = 28.3464567;
  const IMG_W_PX = Math.round(2.6 * CM_TO_PX);
  const IMG_H_PX = Math.round(2.2 * CM_TO_PX);
  const IMG_ROW_HEIGHT_PT = 2.2 * CM_TO_PT;
  // Column widened to fit the 2.6cm image on the left plus the stamp-name text on the right,
  // matching the on-screen "stamp-cell" layout (image + text side by side).
  const STAMP_COL_WIDTH_CHARS = 26;
  const STAMP_COL_WIDTH_PX = Math.round(STAMP_COL_WIDTH_CHARS * 7 + 5);
  const IMG_LEFT_MARGIN_PX = 3; // small left margin instead of centering, so text fits to the right
  const IMG_COL_OFFSET_EMU = IMG_LEFT_MARGIN_PX * 9525;

  exportFactories.forEach(factory=>{
    const dataRows = visibleSectionRows().filter(e=>e.factory===factory);
    // Keep F7 as a real form even when no data has been entered.
    // A blank form row is displayed with "-" in every field.
    const rows = dataRows.length ? dataRows : [null];
    const ws = wb.addWorksheet(factory);

    ws.columns = [
      { width: 6 },                      // A No.
      { width: STAMP_COL_WIDTH_CHARS },  // B Stamp name (image)
      { width: 26 },                     // C Receiver/ID
      { width: 12 },                     // D Dept.
      { width: 11 },                     // E Quantity
      { width: 16 }                      // F Status
    ];

    // Row 1: letterhead — logo (left) + form code in merged E1:F1 (no border on rows 1-3)
    ws.mergeCells('E1:F1');
    const codeCell = ws.getCell('E1');
    codeCell.value = FORM_CODE_LINES.join('\n');
    codeCell.alignment = { horizontal: 'left', vertical: 'middle', wrapText: true };
    codeCell.font = { name: FONT_NAME, size: 9 };
    ws.getRow(1).height = 50;

    ws.addImage(logoImageId, {
      tl: { col: 0, row: 0, colOff: 45000, rowOff: 45000 },
      ext: { width: 168, height: 58 }
    });

    // Row 2: Title
    ws.mergeCells('A2:F2');
    const titleCell = ws.getCell('A2');
    titleCell.value = 'STAMP DISTRIBUTION LIST';
    titleCell.font = TITLE_FONT;
    titleCell.alignment = CENTER;
    ws.getRow(2).height = 22;

    // Row 3: Date
    ws.getCell('A3').value = 'Date:';
    ws.getCell('A3').font = LABEL_FONT;
    ws.getCell('A3').alignment = CENTER;
    ws.getCell('B3').value = exportDate;
    ws.getCell('B3').font = baseFont;
    ws.getCell('B3').alignment = CENTER;
    ws.getRow(3).height = 18;

    // Row 4: table header
    const headerRowIdx = 4;
    const headers = ['No.', 'Stamp name', 'Receiver/ ID', 'Dept.', 'Quantity', 'Status'];
    const headerRow = ws.getRow(headerRowIdx);
    headers.forEach((h, i)=>{
      const cell = headerRow.getCell(i+1);
      cell.value = h;
      cell.font = HEADER_FONT;
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: NAVY } };
      cell.alignment = CENTER;
      cell.border = { top: THIN, bottom: THIN, left: THIN, right: THIN };
    });
    headerRow.height = 18;

    // Data rows
    let currentRow = headerRowIdx + 1;
    rows.forEach((r, rowIndex)=>{
      const row = ws.getRow(currentRow);

      // Always restart No. from 1 on every exported sheet.
      row.getCell(1).value = rowIndex + 1;

      // For an empty form row, show "-" in every field.
      row.getCell(2).value = r ? (r.stamp_name || '-') : '-';
      row.getCell(3).value = r ? (r.receiver || '-') : '-';
      row.getCell(4).value = r ? (r.dept || '-') : '-';
      row.getCell(5).value = r && r.qty !== '' && r.qty !== null && r.qty !== undefined ? r.qty : '-';
      row.getCell(6).value = r ? (r.status || '-') : '-';

      row.eachCell({ includeEmpty: true }, c=>{
        c.font = baseFont;
        c.alignment = CENTER;
        c.border = { bottom: THIN, left: THIN, right: THIN };
      });
      row.getCell(3).alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };

      if(r && r.imageDataUrl && /^data:image\//i.test(r.imageDataUrl)){
        row.height = IMG_ROW_HEIGHT_PT;
        // Text sits to the right of the image (mirrors the on-screen stamp-cell: image + text side by side)
        row.getCell(2).alignment = { horizontal: 'right', vertical: 'middle', wrapText: true, indent: 1 };
        try{
          const ext = /^data:image\/png/i.test(r.imageDataUrl) ? 'png' : 'jpeg';
          const imgId = wb.addImage({ base64: r.imageDataUrl, extension: ext });
          ws.addImage(imgId, {
            tl: { col: 1, row: currentRow - 1, colOff: IMG_COL_OFFSET_EMU, rowOff: 0 },
            ext: { width: IMG_W_PX, height: IMG_H_PX }
          });
        }catch(imgErr){
          console.error('Không chèn được ảnh cho dòng', r.stamp_name, imgErr);
        }
      }else{
        row.height = 18;
      }
      currentRow++;
    });

    // Footer: Report by / Approved by / signature / name
    currentRow += 1;
    ws.mergeCells(`B${currentRow}:C${currentRow}`);
    const reportCell = ws.getCell(`B${currentRow}`);
    reportCell.value = 'Report by: ' + (state.reportBy || '');
    reportCell.font = baseFont;
    reportCell.alignment = CENTER;

    ws.mergeCells(`D${currentRow}:F${currentRow}`);
    const approvedLabelCell = ws.getCell(`D${currentRow}`);
    approvedLabelCell.value = 'Approved by:';
    approvedLabelCell.font = LABEL_FONT;
    approvedLabelCell.alignment = CENTER;

    // Signature row — sits below "Approved by:" and above the printed name (left blank for manual sign-off)
    currentRow += 1;
    const sigRowIdx = currentRow;
    ws.mergeCells(`D${sigRowIdx}:F${sigRowIdx}`);
    ws.getRow(sigRowIdx).height = 26;

    // Printed name
    currentRow += 1;
    ws.mergeCells(`D${currentRow}:F${currentRow}`);
    const nameCell = ws.getCell(`D${currentRow}`);
    nameCell.value = APPROVER_NAME;
    nameCell.font = { name: FONT_NAME, size: FONT_SIZE, bold: true };
    nameCell.alignment = CENTER;
  });

  if(wb.worksheets.length===0){
    throw new Error('No data to export for the current filter.');
  }

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const sectionLabel = state.activeSection === 'QC' ? 'QC_Packing_Chop' : 'Worker_Packing_Chop';
  a.download = `${sectionLabel}_${exportDate}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Tesseract worker is created lazily inside ocrExtract() on first actual OCR use —
// not here — so opening the page doesn't force-download the OCR engine/language data.
Promise.all([loadReceivers(), loadState()]);
</script>
</body>
